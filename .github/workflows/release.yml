name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml and tauri.conf.json) to build the
# Windows portable exe and MSI/NSIS installers plus the Linux .deb and AppImage, and attach them
# all to a GitHub release with the in-app updater's latest.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tauri = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $tauri) {
            Write-Error "Tag v$tag does not match Cargo.toml ($cargo) and tauri.conf.json ($tauri)."
            exit 1
          }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: cargo test --locked

      # Builds target/release/pokeidle-multiview.exe plus the MSI (WiX) and NSIS installers, and
      # signs both installers for the in-app updater (.sig files next to them). The private key
      # is a repository secret; its public half is in tauri.conf.json.
      - run: npx --yes @tauri-apps/cli@2.12.6 build --bundles msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect the Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $nsis = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          Copy-Item target/release/pokeidle-multiview.exe "dist/PokeIdleMultiview_${env:VERSION}_x64_portable.exe"
          Copy-Item $msi "dist/PokeIdleMultiview_${env:VERSION}_x64.msi"
          Copy-Item "$msi.sig" "dist/PokeIdleMultiview_${env:VERSION}_x64.msi.sig"
          Copy-Item $nsis "dist/PokeIdleMultiview_${env:VERSION}_x64-setup.exe"
          Copy-Item "$nsis.sig" "dist/PokeIdleMultiview_${env:VERSION}_x64-setup.exe.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported runner: the AppImage then also runs on older distributions (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: cargo test --locked

      # The .deb and the AppImage; the AppImage is signed for the in-app updater (.sig).
      - run: npx --yes @tauri-apps/cli@2.12.6 build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect the Linux files
        run: |
          mkdir -p dist
          deb=$(ls target/release/bundle/deb/*.deb | head -1)
          app=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          cp "$deb" "dist/PokeIdleMultiview_${VERSION}_amd64.deb"
          cp "$app" "dist/PokeIdleMultiview_${VERSION}_amd64.AppImage"
          cp "$app.sig" "dist/PokeIdleMultiview_${VERSION}_amd64.AppImage.sig"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.json: what the in-app updater reads (releases/latest/download/latest.json).
      # Each Windows installer type updates with its own kind; Linux updates the AppImage.
      - name: Write latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          msi="PokeIdleMultiview_${VERSION}_x64.msi"
          nsis="PokeIdleMultiview_${VERSION}_x64-setup.exe"
          app="PokeIdleMultiview_${VERSION}_amd64.AppImage"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg msi_sig "$(cat "dist/$msi.sig")" --arg msi_url "$base/$msi" \
            --arg nsis_sig "$(cat "dist/$nsis.sig")" --arg nsis_url "$base/$nsis" \
            --arg app_sig "$(cat "dist/$app.sig")" --arg app_url "$base/$app" \
            '{
              version: $version,
              notes: ("PokeIdle Multiview " + $version),
              pub_date: $date,
              platforms: {
                "windows-x86_64-msi": { signature: $msi_sig, url: $msi_url },
                "windows-x86_64-nsis": { signature: $nsis_sig, url: $nsis_url },
                "windows-x86_64": { signature: $msi_sig, url: $msi_url },
                "linux-x86_64-appimage": { signature: $app_sig, url: $app_url },
                "linux-x86_64": { signature: $app_sig, url: $app_url }
              }
            }' > dist/latest.json
          rm dist/*.sig
          ls -la dist

      # SHA256SUMS.txt: lets anyone check that a downloaded file is exactly the one GitHub built
      # from this repository (see SECURITY.md).
      - name: Write SHA256SUMS.txt
        run: |
          cd dist
          sha256sum PokeIdleMultiview_* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: PokeIdle Multiview ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            | File | What it is |
            | --- | --- |
            | `PokeIdleMultiview_${{ env.VERSION }}_x64-setup.exe` | **Windows** installer (no admin rights needed) |
            | `PokeIdleMultiview_${{ env.VERSION }}_x64.msi` | **Windows** Installer package |
            | `PokeIdleMultiview_${{ env.VERSION }}_x64_portable.exe` | **Windows** portable: no install, just run it |
            | `PokeIdleMultiview_${{ env.VERSION }}_amd64.deb` | **Linux** (Debian, Ubuntu, Mint…): `sudo apt install ./<file>.deb` |
            | `PokeIdleMultiview_${{ env.VERSION }}_amd64.AppImage` | **Linux**, any distribution: `chmod +x` and run it |

            Windows: both installers add a Start menu shortcut and install the WebView2 runtime if
            it is missing. Installed copies update themselves (⬆ on the top bar); the portable exe
            shows when a new version is out. The files are not code-signed, so Windows SmartScreen
            may warn the first time: choose **More info → Run anyway**.

            **Check your download:** every file here was built by GitHub Actions from this
            repository's code. `SHA256SUMS.txt` lists their fingerprints; compare yours with
            `Get-FileHash .\<file>` (PowerShell) or `sha256sum <file>` (Linux). How the app handles
            your accounts and data: [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

            Linux is **experimental**: the /hunt extension isn't available there (it needs Chromium),
            and Twitch/Kick video needs the GStreamer plugins (`gstreamer1.0-plugins-good`,
            `-bad` and `gstreamer1.0-libav`; the .deb installs them). The AppImage updates itself.
