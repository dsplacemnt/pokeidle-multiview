<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Economy mode</title>
  <style>
    :root {
      --bg: #14161b; --card: #1d2027; --row: #252932; --line: #2e333d; --chip: #262a33;
      --text: #e6e8ee; --muted: #8b91a1; --accent: #f2c14e; --ok: #3ddc84; --bad: #ff8a80;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
    /* Centred; the page itself scrolls only if a small window really can't fit it. */
    body { display: grid; justify-items: center; align-content: safe center; overflow-y: auto; scrollbar-width: thin;
      padding: 20px 0; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 38%, #1c2029 0%, var(--bg) 62%); }
    .wrap { width: min(1560px, calc(100% - 64px)); display: grid; gap: 18px; justify-items: center; }

    /* The ball: wobbles like a capture, rests, wobbles again. Only transforms and opacity
       animate, which the compositor does without redrawing the page. */
    .stage { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .ball { width: 112px; height: 112px; transform-origin: 50% 88%; animation: wobble 3.2s ease-in-out infinite; }
    .ball svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .45)); }
    .glow { transform-origin: 32px 32px; animation: glow 3.2s ease-in-out infinite; }
    .shadow { position: absolute; bottom: 4px; width: 84px; height: 12px; border-radius: 50%;
      background: rgba(0, 0, 0, .45); filter: blur(4px); animation: shadow 3.2s ease-in-out infinite; }
    .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      opacity: 0; animation: spark 3.2s ease-out infinite; }
    .spark.a { top: 22px; left: 18px; animation-delay: 1.9s; }
    .spark.b { top: 10px; right: 26px; animation-delay: 2.05s; }
    .spark.c { top: 46px; right: 8px; animation-delay: 2.2s; }
    @keyframes wobble {
      0%, 46%, 100% { transform: rotate(0); }
      8% { transform: rotate(-16deg); }
      16% { transform: rotate(13deg); }
      24% { transform: rotate(-8deg); }
      32% { transform: rotate(4deg); }
      40% { transform: rotate(0); }
    }
    @keyframes shadow {
      0%, 46%, 100% { transform: scaleX(1); opacity: .9; }
      8%, 24% { transform: scaleX(.86); opacity: .7; }
      16%, 32% { transform: scaleX(.92); opacity: .8; }
    }
    @keyframes glow { 0%, 50%, 100% { opacity: 0; } 62% { opacity: 1; } 78% { opacity: 0; } }
    @keyframes spark { 0% { opacity: 0; transform: scale(.4) translateY(0); } 15% { opacity: 1; } 60% { opacity: 0; transform: scale(1) translateY(-14px); } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ball, .shadow, .glow, .spark { animation: none; } }
    /* Short windows: a smaller ball, so the accounts fit without scrolling. */
    @media (max-height: 860px) {
      .stage { width: 96px; height: 96px; }
      .ball { width: 72px; height: 72px; }
      .shadow { width: 56px; height: 9px; bottom: 2px; }
      .wrap { gap: 12px; }
    }

    header { text-align: center; display: grid; gap: 6px; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--accent); }
    header p { margin: 0; color: var(--muted); }
    button { background: var(--chip); color: var(--text); border: 1px solid #3a3f4b; border-radius: 8px;
      height: 32px; padding: 0 14px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; }
    button.primary:hover { background: #ffd76b; border-color: #ffd76b; }
    button.small { height: 26px; padding: 0 10px; font-size: 12.5px; flex: none; }
    button.small.quiet { background: transparent; color: var(--muted); }
    button.small.quiet:hover { color: var(--text); background: var(--chip); }

    .card { width: 100%; background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 6px 18px rgba(0, 0, 0, .18); }
    .card h2 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 8px; }
    .card h2 .count { background: rgba(255, 138, 128, .16); color: var(--bad); border-radius: 10px; padding: 0 7px; letter-spacing: 0; }
    .list { display: grid; gap: 6px; max-height: 34vh; overflow-y: auto; scrollbar-width: thin; }
    .notice { display: flex; align-items: center; gap: 10px; background: var(--row); border-radius: 9px; padding: 8px 8px 8px 12px; }
    .notice .icon { flex: none; width: 22px; text-align: center; font-size: 15px; }
    .notice .text { flex: 1; min-width: 0; display: grid; }
    .notice .text b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notice .text span { color: var(--muted); font-size: 12.5px; }
    .notice.warn .icon { color: var(--bad); }
    .notice.vote .icon { color: var(--accent); }
    .notice.login .icon { color: #ffd27a; }
    .calm { color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 2px 2px; }
    .calm b { color: var(--ok); }

    /* Accounts: a box each. Top line: name, bonuses running, streams open. Bottom line: the
       hunt (status, level, gold, supplies with how long they last). */
    /* Two side by side when there's room (cards of 440 px or more), no scroll inside. */
    .accounts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, max(440px, calc((100% - 8px) / 2))), 1fr)); }
    /* Every card has the same four parts (name, bonuses, hunt, items) on rows shared with the
       cards beside it, so each part starts at the same height whatever the others hold. */
    .account { display: grid; grid-row: span 4; grid-template-rows: subgrid; grid-template-columns: minmax(0, 1fr); row-gap: 8px; align-content: start;
      background: var(--row); border-radius: 10px; padding: 10px 12px; }
    .account .line { display: flex; align-items: center; gap: 8px; min-height: 24px; }
    .account .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .account .hunt { font-size: 12px; font-variant-numeric: tabular-nums; }
    .res.gold { margin-left: auto; }
    /* Items: a section per kind (balls, potions, revives), side by side: balls and revives as
       wide as they need, potions (most accounts tick several) the rest. */
    .kinds { display: flex; align-items: flex-start; gap: 0;
      border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .kind { display: block; min-width: 0; padding: 0 10px; flex: none; width: max-content; max-width: 40%; }
    .kind-potion { flex: 1 1 0; width: auto; max-width: none; }
    .kind:first-child { padding-left: 0; }
    .kind:last-child { padding-right: 0; }
    .kind + .kind { border-left: 1px solid var(--line); }
    .klabel { display: block; margin-bottom: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .knone { color: var(--muted); height: 22px; display: inline-flex; align-items: center; }
    .hstate { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; color: var(--muted); font-weight: 600; }
    .hstate .dot { width: 8px; height: 8px; border-radius: 50%; background: #5b6170; flex: none; }
    .hstate .where { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hstate.hunting { color: var(--ok); }
    .hstate.hunting .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(61, 220, 132, .18); }
    .hstate.idle { color: #ffb74d; }
    .hstate.idle .dot { background: #ffb74d; }
    .hstate.down { color: var(--bad); }
    .hstate.down .dot { background: var(--bad); }
    /* Streams only (the game runs on another computer): a little broadcasting TV where the hunt
       and the items would be, over both of those rows. */
    .so-art { grid-row: span 2; display: flex; align-items: center; gap: 14px; min-width: 0; padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(145, 70, 255, .22);
      background: linear-gradient(100deg, rgba(145, 70, 255, .13), rgba(83, 252, 24, .06) 70%, transparent); }
    .so-art svg { width: 76px; height: 60px; flex: none; overflow: visible; }
    .so-art .so-text { display: grid; gap: 2px; min-width: 0; }
    .so-art b { font-size: 14px; font-weight: 700; color: var(--text); }
    .so-art span { color: #b9bfcc; font-size: 12.5px; }
    .so-art small { color: var(--muted); font-size: 11.5px; }
    .so-art b, .so-art span, .so-art small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .so-art .wave { animation: so-wave 2.6s ease-in-out infinite; }
    .so-art .wave.w2 { animation-delay: .35s; }
    .so-art .live-dot { animation: so-blink 1.6s ease-in-out infinite; }
    @keyframes so-wave { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes so-blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .so-art .wave, .so-art .live-dot { animation: none; } }
    .lvl { color: var(--muted); flex: none; }
    .lvl b { color: var(--text); font-weight: 600; }
    /* Gold and supplies: the game's own icon, how many, and how long it lasts (the item's name
       is in the tooltip). */
    .res { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 4px; border-radius: 11px;
      background: var(--chip); flex: none; font-weight: 600; }
    .res img { width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated; flex: none; }
    .res .noicon { color: var(--muted); font-size: 11px; font-weight: 500; }
    .res small { color: var(--muted); font-size: 11px; font-weight: 500; }
    .res small.pos { color: var(--ok); }
    .res small.neg { color: var(--bad); }
    .res.warn small { color: #ffb74d; font-weight: 700; }
    .res.low { box-shadow: inset 0 0 0 1px rgba(255, 138, 128, .55); }
    .res.low small { color: var(--bad); font-weight: 700; }
    /* In the bag but not ticked for automatic use. */
    .res.off { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-weight: 500; }
    .res.off img { opacity: .45; filter: grayscale(.6); }
    .bonus { height: 20px; padding: 0 8px; border-radius: 10px; display: inline-flex; align-items: center;
      font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
    .bonus.none { color: var(--muted); background: transparent; border: 1px dashed #3a3f4b; font-weight: 500; }
    /* Bonuses: a row per effect (XP, capture, lure, loot, Prey): its name (and XP's total) on
       the left, then each source as a chip with its icon, how much it gives and how long it
       has left. */
    /* Always the same three lines, in the same places: XP; Capture | Lure; Loot | Prey. */
    .boosts { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 5px 10px;
      align-items: start; align-content: start; border-top: 1px solid var(--line); padding-top: 8px;
      font-size: 12px; font-variant-numeric: tabular-nums; }
    .boosts .klabel { margin: 0; height: 22px; display: flex; align-items: center; }
    .boosts .klabel.right { padding-left: 10px; border-left: 1px solid var(--line); }
    .boosts .wide { grid-column: 2 / -1; }
    .boosts .total { height: 22px; display: inline-flex; align-items: center; gap: 6px; padding-right: 2px;
      color: var(--accent); font-weight: 700; flex: none; }
    .boosts .total small { color: var(--muted); font-size: 11px; font-weight: 600; }
    .boosts .empty { color: #5b6170; height: 22px; display: inline-flex; align-items: center; }
    /* The name line: the account, its trainer level, then (right) the fight and the streams. */
    .account .line .name { flex: 0 1 auto; }
    .account .line .tlvl { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12px;
      font-variant-numeric: tabular-nums; }
    .account .line .tlvl::before { content: ''; width: 1px; height: 14px; background: var(--line); }
    .account .line .spacer { flex: 1; min-width: 4px; }
    /* The fight right now: your Pokémon vs the wild one, as small pictures (names in the
       tooltip), each centred on the drawing itself in a box of its own. */
    .fight { display: inline-flex; align-items: center; gap: 4px; flex: none; }
    .fight + .streams { margin-left: 10px; }
    .mon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px;
      margin: -3px 0; border-radius: 7px; background: rgba(255, 255, 255, .035); flex: none; }
    .mon.shiny { box-shadow: inset 0 0 0 1px rgba(255, 215, 107, .7); }
    .mon.empty { color: #5b6170; font-size: 12px; }
    .fight .vs { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: #5b6170; }
    /* Narrower cards: the Prey chips drop the bonus kind and keep the Pokémon and its stars. */
    .account { container-type: inline-size; }
    @container (max-width: 640px) {
      .res.src .pkind { display: none; }
    }
    .spr { position: relative; flex: none; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; }
    .spr i { position: absolute; left: 50%; top: 50%; image-rendering: pixelated; background-repeat: no-repeat; }
    .spr.none::after { content: ''; width: 40%; height: 40%; border-radius: 50%; background: #3a3f4b; }
    .res.src svg { width: 15px; height: 15px; display: block; flex: none; margin: 0 1px; }
    .res.src .glyph { width: 18px; text-align: center; color: var(--accent); font-size: 12px; flex: none; }
    .res.src .tag { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .res.src { flex: 0 1 auto; min-width: 0; max-width: 100%; }
    .res.src .pname { max-width: 110px; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res.src .tag, .res.src small { flex: none; white-space: nowrap; }
    /* Streams open per platform: the platform's logo and the count, in its colour. A platform
       with none stays (dimmed) so the counts line up from row to row. */
    .streams { display: inline-flex; gap: 6px; flex: none; margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
    .live { height: 22px; min-width: 46px; padding: 0 8px 0 4px; border-radius: 11px; display: inline-flex; align-items: center;
      gap: 5px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .live svg { width: 15px; height: 15px; display: block; flex: none; }
    .live.twitch { color: #c4a5ff; background: rgba(145, 70, 255, .16); box-shadow: inset 0 0 0 1px rgba(145, 70, 255, .35); }
    .live.kick { color: #8ff56a; background: rgba(83, 252, 24, .10); box-shadow: inset 0 0 0 1px rgba(83, 252, 24, .30); }
    .live.zero { opacity: .38; }
  </style>
  <script src="i18n.js"></script>
  <script src="shortcuts.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="stage" aria-hidden="true">
      <span class="spark a"></span><span class="spark b"></span><span class="spark c"></span>
      <div class="ball">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="#f4f6f9"/>
          <path d="M5 32a27 27 0 0 1 54 0z" fill="#ee2b3b"/>
          <rect x="5" y="29" width="54" height="6" fill="#1c1f26"/>
          <circle cx="32" cy="32" r="28.5" fill="none" stroke="#1c1f26" stroke-width="3"/>
          <circle cx="32" cy="32" r="10" fill="#1c1f26"/>
          <circle cx="32" cy="32" r="6.5" fill="#f4f6f9"/>
          <circle class="glow" cx="32" cy="32" r="6.5" fill="#fff6c2"/>
          <ellipse cx="22" cy="15" rx="8" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-32 22 15)"/>
        </svg>
      </div>
      <span class="shadow"></span>
    </div>

    <header>
      <h1 data-i18n>Economy mode</h1>
      <p id="sub"></p>
    </header>
    <button id="leave" class="primary"></button>

    <section class="card">
      <h2><span data-i18n>Needs you</span><span class="count" id="count" hidden></span></h2>
      <div class="list" id="notices"></div>
    </section>

    <section class="card">
      <h2 data-i18n>Accounts</h2>
      <div class="accounts" id="accounts"></div>
    </section>
  </div>

  <script>
    // Economy mode's screen: the accounts keep running hidden (no CPU spent drawing them) while
    // this light page shows what needs the player: streams with a problem and IdleHub votes
    // that are ready. Everything comes from the app's state; nothing is fetched.
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { t } = I18N;
    const PLATFORM = { twitch: 'Twitch', kick: 'Kick' };
    // The same logos as the slot headers (slot.html).
    const LOGO = {
      twitch: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9146FF" d="M4.3 2 2.5 6.5V20h5v2.5h2.8l2.5-2.5h4l4.7-4.7V2H4.3Z"/><path fill="#fff" d="M19.5 14.2 16.7 17h-4.5l-2.5 2.5V17H5.5V4h14v10.2Z"/><path fill="#9146FF" d="M15.2 7.2h2v5.6h-2zM10.6 7.2h2v5.6h-2z"/></svg>',
      kick: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#53FC18"/><path fill="#0B0E0F" d="M5.5 4.5h5v4h1.7V6.6h1.9V4.5h4.4v5.3h-2.1v1.9h-1.9v.6h1.9v1.9h2.1v5.3h-4.4v-2.1h-1.9v-1.9h-1.7v4h-5z"/></svg>',
    };
    let latest = null;

    const el = (tag, className, text) => {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const slotName = (slot) => slot.name || `Slot ${slot.id}`;

    // The hunt, as the game pages report it every 30 s (game-watch.js; the same numbers as the
    // stats panel). The game has no "hunting" flag: an account hunts while its kills go up.
    const GAME = 'https://pokeidle.io';
    const GOLD_ICON = '/assets/site/assets/ui/moeda-ouro.png';
    const HUNTING_FOR = 3 * 60000;
    const STALE_AFTER = 3 * 60000;
    const huntName = (slug) => (slug || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    // Numbers in the app's language (12.450 / 12,450; 124,5 mil / 124.5K).
    const locale = () => ({ pt: 'pt-BR', es: 'es' })[I18N.lang] || 'en';
    const compact = (n) => (n === null || n === undefined ? '—'
      : Math.abs(n) >= 1e4 ? new Intl.NumberFormat(locale(), { notation: 'compact', maximumFractionDigits: 1 }).format(n)
      : Math.round(n).toLocaleString(locale()));
    const hoursText = (h) => {
      const m = Math.round(h * 60);
      const d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
      return d ? `${d}d ${hh}h` : hh ? `${hh}h${String(mm).padStart(2, '0')}` : `${mm}m`;
    };
    // The game's icon for an item; its name instead if the image doesn't load.
    function gameIcon(path, name) {
      const img = el('img');
      img.alt = name;
      img.src = path.startsWith('http') ? path : GAME + path;
      img.addEventListener('error', () => img.replaceWith(el('span', 'noicon', name)));
      return img;
    }

    // The hunt's lines: status, level and gold; then the supplies used in it, if any.
    function huntLines(slot, state, now) {
      const line = el('div', 'line hunt');
      const h = state.hunts?.[slot.id];
      const issue = state.game_issues?.[slot.id];
      const status = el('span', 'hstate');
      status.append(el('span', 'dot'));
      if (issue) {
        status.classList.add('down');
        status.append(el('span', '', I18N.text(issue)));
        line.append(status);
        return [line];
      }
      if (!h || h.v !== 2 || now - (h.at || 0) > STALE_AFTER) {
        status.append(el('span', '', t('Waiting for the game')));
        status.title = t('The game reports its hunt every 30 s once it has loaded');
        line.append(status);
        return [line];
      }
      if (!h.hunt) {
        status.append(el('span', '', t('Not hunting')));
      } else if (h.killAt && now - h.killAt < HUNTING_FOR) {
        status.classList.add('hunting');
        status.append(el('span', '', t('Hunting')), el('span', 'where', `· ${huntName(h.hunt)}`));
        status.title = t('Kills in the last few minutes');
      } else {
        status.classList.add('idle');
        status.append(el('span', '', t('Stopped')), el('span', 'where', `· ${huntName(h.hunt)}`));
        status.title = t('No kills in the last few minutes');
      }
      line.append(status);
      // Gold: what the account has, and the net per hour (gold earned minus supplies used).
      if (h.gold !== null && h.gold !== undefined) {
        const gold = el('span', 'res gold');
        gold.append(gameIcon(GOLD_ICON, t('Gold')), compact(h.gold));
        if (h.netPerHour !== null && h.netPerHour !== undefined) {
          gold.append(el('small', h.netPerHour < 0 ? 'neg' : 'pos', `${h.netPerHour >= 0 ? '+' : ''}${compact(h.netPerHour)}/h`));
        }
        gold.title = h.netPerHour !== null && h.netPerHour !== undefined
          ? t('Gold: {gold} · net {net} per hour (earned minus supplies used)', { gold: compact(h.gold), net: compact(h.netPerHour) })
          : t('Gold: {gold}', { gold: compact(h.gold) });
        line.append(gold);
      }
      return [line, itemSections(h)];
    }

    // The items the account has (none at 0), one section per kind. First the ones ticked for
    // automatic use, in the order the game uses them (it takes the first one with stock), then
    // the rest of the bag, dimmed. How long it lasts shows for what's in use (same colours as
    // the stats panel: under 6 h amber, under 2 h red).
    const KINDS = [['ball', 'Balls'], ['potion', 'Potions'], ['revive', 'Revives']];
    function itemSections(h) {
      const box = el('div', 'kinds');
      // Until the game has sent its auto-use choices, nothing is known to be ticked or not:
      // the items show plainly, the one running out first first.
      const known = h.auto !== null && h.auto !== undefined;
      for (const [kind, label] of KINDS) {
        const sec = el('div', `kind kind-${kind}`);
        sec.append(el('span', 'klabel', t(label)));
        const chips = el('div', 'chips');
        const of = (h.supplies || []).filter((s) => s.kind === kind);
        const all = of.filter((s) => s.left > 0).map((s) => (known ? s : { ...s, on: true, order: null }));
        const ticked = all.filter((s) => s.on).sort((a, b) => (known ? a.order - b.order : (a.hoursLeft ?? Infinity) - (b.hoursLeft ?? Infinity)));
        const rest = all.filter((s) => !s.on).sort((a, b) => b.left - a.left);
        ticked.forEach((s, i) => chips.append(itemChip(s, known ? i + 1 : null)));
        rest.forEach((s) => chips.append(itemChip(s, null)));
        if (!all.length) {
          // Potions and revives come with the full bag, every few minutes.
          const waiting = of.some((s) => s.left === null || s.left === undefined);
          const none = el('span', 'knone', waiting ? '…' : '—');
          none.title = waiting ? t('Waiting for the game to show the bag (a few minutes)') : t('None in the bag');
          chips.append(none);
        }
        sec.append(chips);
        box.append(sec);
      }
      return box;
    }

    // rank: its place among the ticked items that have stock (1 = the one in use now).
    function itemChip(s, rank) {
      const lasts = s.on && s.hoursLeft !== null && s.hoursLeft !== undefined;
      const r = el('span', 'res' + (!s.on ? ' off' : lasts && s.hoursLeft < 2 ? ' low' : lasts && s.hoursLeft < 6 ? ' warn' : ''));
      if (s.icon) r.append(gameIcon(s.icon, s.name));
      else r.append(el('span', 'noicon', s.name));
      r.append(compact(s.left));
      if (lasts) r.append(el('small', '', hoursText(s.hoursLeft)));
      r.title = !s.on
        ? (s.order !== null && s.order !== undefined
          ? t('{name}: {left} — ticked, but automatic use of this kind is off in the game', { name: s.name, left: compact(s.left) })
          : t('{name}: {left} — not ticked for automatic use', { name: s.name, left: compact(s.left) }))
        : `${lasts ? t('{name}: {left} left, {rate} per hour — lasts about {time}', { name: s.name, left: compact(s.left), rate: compact(s.perHour), time: hoursText(s.hoursLeft) })
          : t('{name}: {left} left, not used in this hunt yet', { name: s.name, left: compact(s.left) })}${rank ? `\n${t('#{n} in the automatic use order', { n: rank })}` : ''}`;
      return r;
    }

    // Every bonus the account has running, by effect, each source a chip (game-watch.js reads
    // them from the game's state: the same list as the game's own "active" panel). Before the
    // game has reported them, the Twitch and Kick ones the app already knows.
    const SOURCE = {
      vip: ['VIP', '/assets/site/assets/loja/vip.png'],
      boostXp: ['XP Boost', '/assets/site/assets/loja/exp.png'],
      boostPokexp: ['Pokémon XP Boost', '/assets/site/assets/loja/boost.png'],
      guildBoost: ['Guild Boost', '/img/itens/boost-guild-32.png'],
      guild: ['Guild ranking', '/img/itens/guild-escudo-32.png'],
      sacrificio: ['Sacrifice Boost', '/img/itens/rare-bone.png'],
      raid: ['Gigantamax Raid', '/img/boss-cabeca-16.png'],
      atrasados: ['Late Joiner Boost', '/assets/site/assets/loja/exp.png'],
      evento: ['Event', null, '⚡'],
      outros: ['Other bonus', null, '?'],
      twitch: ['Twitch'],
      kick: ['Kick'],
    };
    const SHOP = { xp: 'XP Boost', pokexp: 'Pokémon XP Boost', loot: 'Loot Boost', captura: 'Capture Boost', shiny: 'Shiny Secret Lure' };
    const PREY_BONUS = { dano: 'Damage', defesa: 'Defense', captura: 'Capture', spawn: 'Spawn' };
    const SOON = 15 * 60000;
    const pctText = (p) => `+${p.toLocaleString(locale(), { maximumFractionDigits: 1 })}%`;

    function boostList(slot, state) {
      const reported = state.hunts?.[slot.id]?.boosts;
      if (reported && Array.isArray(reported.list)) return reported;
      const list = [];
      const running = state.bonuses?.[slot.id] || {};
      // Streams only: the app's own estimate (the game runs on another computer).
      const est = !!slot.streams_only;
      for (const platform of ['twitch', 'kick']) {
        for (const [kind, k] of [['xp', 'xp'], ['capture', 'cap'], ['lure', 'lure']]) {
          const e = running[platform]?.[kind] || 0;
          if (e) list.push({ s: platform, k, p: est ? 15 : null, e, est });
        }
      }
      return { xp: null, list };
    }

    function sourceName(b) {
      if (b.s === 'shop') return t('{name} (shop)', { name: t(SHOP[b.b] || b.b) });
      if (b.s === 'prey') return t('Prey');
      return t(SOURCE[b.s]?.[0] || 'Other bonus');
    }

    function boostChip(b, now) {
      const paused = b.z > 0;
      const ends = b.e > 0 ? b.e - now : null;
      const offHunt = b.s === 'prey' && b.h === false;
      const chip = el('span', 'res src' + (paused || offHunt ? ' off' : ends !== null && ends < SOON ? ' warn' : ''));
      const [, icon, glyph] = SOURCE[b.s] || [];
      if (b.s === 'twitch' || b.s === 'kick') chip.innerHTML = LOGO[b.s];
      else if (b.s === 'shop' && b.i) chip.append(gameIcon(b.i, sourceName(b)));
      else if (icon) chip.append(gameIcon(icon, sourceName(b)));
      else if (b.s === 'prey') chip.append(el('span', 'glyph', '🎯'));
      else chip.append(el('span', 'glyph', glyph || '?'));
      let effect;
      if (b.s === 'prey') {
        const kind = t(PREY_BONUS[b.b] || 'Bonus');
        const tag = el('span', 'tag');
        tag.append(el('span', 'pkind', `${kind} `), b.st ? `${b.st}★` : '');
        chip.append(el('span', 'pname', b.n), tag);
        effect = `${b.n} · ${kind}${b.st ? ` (${b.st}★)` : ''}`;
      } else {
        if (b.p !== null && b.p !== undefined) chip.append(pctText(b.p));
        if (b.k === 'pk') chip.append(el('span', 'tag', 'PK'));
        const what = { xp: b.o === 'tr' ? t('trainer XP') : 'XP', pk: t('Pokémon XP'), cap: t('Capture'), lure: t('Lure'), loot: t('Loot') }[b.k] || b.k;
        effect = b.p !== null && b.p !== undefined ? `${pctText(b.p)} ${what}` : what;
      }
      if (paused) chip.append(el('small', '', `⏸ ${left(b.z)}`));
      else if (ends !== null) chip.append(el('small', '', `${b.est ? '≈ ' : ''}${left(ends)}`));
      const when = paused ? t('paused in the Safari, {time} left', { time: left(b.z) })
        : ends !== null ? t('{time} left', { time: left(ends) }) : t('no end');
      chip.title = `${sourceName(b)}: ${effect} · ${when}`
        + (offHunt ? `\n${t('Not in the current hunt: the Prey bonus only works while hunting this Pokémon')}` : '')
        + (b.est ? `\n${t('Estimated from this app\'s redeems (the game runs on another computer)')}` : '');
      return chip;
    }

    function boostSections(slot, state, now) {
      const { xp, list } = boostList(slot, state);
      const live = list.filter((b) => b.z > 0 || !(b.e > 0) || b.e > now);
      const box = el('div', 'boosts');
      const known = new Set(['xp', 'pk', 'cap', 'lure', 'loot', 'prey']);
      // Effects the app doesn't know yet go with Loot.
      const of = (k) => live.filter((b) => (k === 'xp' ? b.k === 'xp' || b.k === 'pk' : k === 'loot' ? b.k === 'loot' || !known.has(b.k) : b.k === k));
      const order = (a, b) => (b.p ?? -1) - (a.p ?? -1) || (a.e || Infinity) - (b.e || Infinity);
      // A cell: the effect's name, then its sources (or a dash), always in the same place.
      const cell = (k, label, cls) => {
        const head = el('span', `klabel${cls === 'right' ? ' right' : ''}`, t(label));
        const chips = el('div', `chips${cls === 'wide' ? ' wide' : ''}`);
        if (k === 'xp' && xp && (xp.tr > 0 || xp.pk > 0)) {
          const total = el('span', 'total', pctText(xp.tr));
          if (xp.tr !== xp.pk) total.append(el('small', '', `PK ${pctText(xp.pk)}`));
          total.title = t('Trainer XP {tr} · Pokémon XP {pk} (the game multiplies the sources together)', { tr: pctText(xp.tr), pk: pctText(xp.pk) });
          chips.append(total);
        }
        const items = of(k).sort(order);
        items.forEach((b) => chips.append(boostChip(b, now)));
        if (!items.length) {
          const none = el('span', 'empty', '—');
          none.title = t('no bonus');
          chips.append(none);
        }
        box.append(head, chips);
      };
      cell('xp', 'XP', 'wide');
      cell('cap', 'Capture');
      cell('lure', 'Lure', 'right');
      cell('loot', 'Loot');
      cell('prey', 'Prey', 'right');
      return box;
    }

    // A streams-only account's card: a little TV on the air (screen in Twitch purple fading to
    // Kick green, LIVE tag, signal waves) and what this slot does.
    const SO_TV = `<svg viewBox="0 0 80 64" aria-hidden="true">
      <defs><linearGradient id="so-screen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9146ff"/><stop offset="1" stop-color="#53fc18"/></linearGradient></defs>
      <path class="wave" d="M5 24a14 14 0 0 0 0 18" fill="none" stroke="#c4a5ff" stroke-width="2.2" stroke-linecap="round"/>
      <path class="wave w2" d="M-1 19a21 21 0 0 0 0 28" fill="none" stroke="#c4a5ff" stroke-width="2.2" stroke-linecap="round"/>
      <path class="wave" d="M75 24a14 14 0 0 1 0 18" fill="none" stroke="#8ff56a" stroke-width="2.2" stroke-linecap="round"/>
      <path class="wave w2" d="M81 19a21 21 0 0 1 0 28" fill="none" stroke="#8ff56a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M31 4l9 9 9-9" fill="none" stroke="#8b91a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="4" r="2" fill="#8b91a1"/><circle cx="49" cy="4" r="2" fill="#8b91a1"/>
      <rect x="11" y="13" width="58" height="42" rx="9" fill="#1d2027" stroke="#3a3f4b" stroke-width="1.5"/>
      <rect x="16" y="18" width="40" height="32" rx="5" fill="url(#so-screen)" opacity=".9"/>
      <path d="M32 27v14l11-7z" fill="#fff"/>
      <rect x="19" y="21" width="17" height="7" rx="3.5" fill="#ff4d5e"/>
      <circle class="live-dot" cx="22.5" cy="24.5" r="1.4" fill="#fff"/>
      <text x="25" y="26.6" font-size="5.2" font-weight="700" fill="#fff" font-family="Segoe UI, sans-serif">LIVE</text>
      <circle cx="62.5" cy="27" r="2.6" fill="#3a3f4b"/><circle cx="62.5" cy="36" r="2.6" fill="#3a3f4b"/>
      <rect x="20" y="55" width="7" height="4" rx="1.5" fill="#3a3f4b"/><rect x="53" y="55" width="7" height="4" rx="1.5" fill="#3a3f4b"/>
    </svg>`;
    function streamsOnlyArt() {
      const art = el('div', 'so-art');
      art.innerHTML = SO_TV;
      const text = el('div', 'so-text');
      text.append(el('b', '', t('Streams only')),
        el('span', '', t('Watching, opening chests and redeeming bonuses')),
        el('small', '', t('This account\'s game runs on another computer')));
      art.append(text);
      art.title = t('This account\'s game runs on another computer: here it only watches its streams, opens chests and redeems its bonuses');
      return art;
    }

    // Your Pokémon vs the wild one, small (the same sprites as the stats panel). Cut to where
    // the drawing really is in its frame ("trim", measured by the game page) when known, so
    // every Pokémon sits in the middle of its box; otherwise the whole frame.
    const SPRITE_BOX = 26;
    function spriteEl(look, sprites) {
      const box = el('span', 'spr');
      const s = look ? sprites?.[look] : null;
      if (!s) { box.classList.add('none'); return box; }
      const [x, y, w, h] = Array.isArray(s.trim) ? s.trim : [s.x, s.y, s.w, s.h];
      const img = el('i');
      const scale = Math.max(0.25, Math.min(1.5, SPRITE_BOX / w, SPRITE_BOX / h));
      Object.assign(img.style, {
        width: `${w}px`, height: `${h}px`,
        backgroundImage: `url("${s.src}")`, backgroundPosition: `-${x}px -${y}px`,
        transform: `translate(-50%, -50%) scale(${scale})`,
      });
      box.append(img);
      return box;
    }
    function fightEl(slot, state, now) {
      const h = state.hunts?.[slot.id];
      if (!h || h.v !== 2 || now - (h.at || 0) > STALE_AFTER || state.game_issues?.[slot.id] || (!h.pokemon && !h.foe)) return null;
      const fight = el('span', 'fight');
      const mon = (p, who) => {
        const m = el('span', 'mon' + (p?.shiny ? ' shiny' : ''));
        if (!p) { m.classList.add('empty'); m.append('—'); m.title = who; return m; }
        m.append(spriteEl(p.look, state.sprites));
        m.title = `${who}: ${p.name} · Lv ${p.level ?? '?'}${p.shiny ? ' · shiny ✦' : ''}`;
        return m;
      };
      fight.append(mon(h.pokemon, t('Your Pokémon')), el('span', 'vs', 'VS'), mon(h.foe, t('Wild Pokémon')));
      return fight;
    }

    function left(ms) {
      if (ms < 60000) return '<1m';
      const m = Math.floor(ms / 60000);
      const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h${String(mm).padStart(2, '0')}`;
      return `${mm}m`;
    }

    // A row of the list: icon, title and detail, a main button and, optionally, a quiet second
    // one before it (extra: [label, action, title]).
    function notice(kind, icon, title, detail, button, action, extra) {
      const row = el('div', `notice ${kind}`);
      const text = el('div', 'text');
      text.append(el('b', '', title), el('span', '', detail));
      row.append(el('span', 'icon', icon), text);
      if (extra) {
        const x = el('button', 'small quiet', extra[0]);
        x.title = extra[2] || '';
        x.addEventListener('click', extra[1]);
        row.append(x);
      }
      if (button) {
        const b = el('button', 'small', button);
        b.addEventListener('click', action);
        row.append(b);
      }
      return row;
    }

    function render() {
      const state = latest;
      if (!state) return;
      const now = Date.now();
      const names = Object.fromEntries(state.slots.map((s) => [s.id, slotName(s)]));
      const streams = Object.values(state.panels || {}).reduce((n, p) => n + (p.pages || []).length, 0);
      document.getElementById('sub').textContent = t('{accounts} accounts keep running hidden · {streams} streams in the background', { accounts: state.slots.length, streams });
      const keys = Shortcuts.keys('economy');
      document.getElementById('leave').textContent = t('Show the accounts') + (keys ? ` (${keys})` : '');

      // What needs the player.
      const rows = [];
      // A platform's live checks all fail: every account's streams there are stuck.
      for (const c of I18N.checksDown(state)) {
        rows.push(notice('warn', '⚠', c.title, c.detail, t('Check again'), () => invoke('check_streams_now')));
      }
      for (const slot of state.slots) {
        // The account's game itself dropped out (logged in elsewhere, disconnected, no session).
        const issue = state.game_issues?.[slot.id];
        if (issue) {
          rows.push(notice('warn', '⚠', t('{name}: the game needs you', { name: names[slot.id] }), I18N.text(issue),
            t('Reload'), () => invoke('reload_slot', { id: slot.id })));
        }
        for (const page of (state.panels?.[slot.id]?.pages || [])) {
          if (!page.warning) continue;
          rows.push(notice('warn', '⚠', `${names[slot.id]} · ${PLATFORM[page.platform] || page.platform} ${page.login || ''}`,
            I18N.text(page.warning), t('Show'), () => invoke('focus_slot', { id: slot.id })));
        }
        for (const platform of ['twitch', 'kick']) {
          if (state.logins?.[slot.id]?.[platform] !== false) continue;
          rows.push(notice('login', '🔑', t('{name} isn\'t logged in on {platform}', { name: names[slot.id], platform: PLATFORM[platform] }),
            t('Its {platform} streams wait for a login (they would earn nothing)', { platform: PLATFORM[platform] }),
            t('Log in'), () => invoke('open_login', { id: slot.id, platform })));
        }
        const prey = state.prey_pending?.[slot.id];
        if (prey) {
          rows.push(notice('prey', '🎯', prey === 'pick' ? t('{name}: pick the Prey Pokémon', { name: names[slot.id] }) : t('{name}: daily Prey ready', { name: names[slot.id] }),
            prey === 'pick' ? t('Rolled, but none of the 9 is picked: the bonus does nothing yet') : t('The free roll renews every day at 18:00 (Brasília)'),
            t('Show'), () => invoke('focus_slot', { id: slot.id }),
            [t('Not today'), () => invoke('dismiss_prey', { id: slot.id }), t("Hide this account's Prey reminder until 18:00 (Brasília)")]));
        }
        const vote = state.vote?.[slot.id];
        if (vote && vote.readyAt && vote.readyAt <= now) {
          rows.push(notice('vote', '★', t('IdleHub vote ready'), t('{name} can vote now (+1 toward a diamond)', { name: names[slot.id] }),
            t('Vote'), () => invoke('open_vote', { id: slot.id })));
        }
      }
      const count = document.getElementById('count');
      count.hidden = !rows.length;
      count.textContent = rows.length;
      const list = document.getElementById('notices');
      if (rows.length) list.replaceChildren(...rows);
      else {
        const calm = el('div', 'calm');
        calm.append(el('b', '', '✓'), t('Nothing needs you right now. This list fills in when something does.'));
        list.replaceChildren(calm);
      }

      // Each account with its streams open on Twitch and Kick, and its running bonuses (the
      // longest of Kick's and Twitch's of each kind).
      document.getElementById('accounts').replaceChildren(...state.slots.map((slot) => {
        const box = el('div', 'account');
        const row = el('div', 'line');
        row.append(el('span', 'name', names[slot.id]));
        // The trainer's level beside the name.
        const tr = state.hunts?.[slot.id]?.trainer;
        if (tr && tr.level !== null && tr.level !== undefined) {
          const lv = el('span', 'lvl tlvl');
          const text = el('span');
          text.append(el('b', '', `Lv ${tr.level}`), tr.pct !== null && tr.pct !== undefined ? ` · ${tr.pct}%` : '');
          lv.append(text);
          lv.title = t('Trainer level');
          row.append(lv);
        }
        row.append(el('span', 'spacer'));
        const pages = state.panels?.[slot.id]?.pages || [];
        const lives = el('span', 'streams');
        for (const platform of ['twitch', 'kick']) {
          const n = pages.filter((p) => p.platform === platform).length;
          const chip = el('span', `live ${platform}${n ? '' : ' zero'}`);
          chip.innerHTML = LOGO[platform];
          chip.append(String(n));
          chip.title = t(n === 1 ? '{n} {platform} stream open' : '{n} {platform} streams open', { n, platform: PLATFORM[platform] });
          lives.append(chip);
        }
        const fight = fightEl(slot, state, now);
        if (fight) row.append(fight);
        row.append(lives);
        // Always four parts (an empty one where the game hasn't sent the items yet), so the
        // rows line up with the card beside it.
        // Streams only: no hunt or items here, the broadcasting TV instead (over both rows).
        if (slot.streams_only) {
          box.append(row, boostSections(slot, state, now), streamsOnlyArt());
          return box;
        }
        const hunt = huntLines(slot, state, now);
        while (hunt.length < 2) hunt.push(el('div'));
        box.append(row, boostSections(slot, state, now), ...hunt);
        return box;
      }));
    }

    document.getElementById('leave').addEventListener('click', () => invoke('set_economy', { on: false }));
    listen('state', (e) => { latest = e.payload; render(); });
    I18N.onChange(render);
    Shortcuts.onChange(render);
    invoke('get_state').then((s) => { latest = s; render(); });
    // Countdowns and votes that come due.
    setInterval(render, 30000);
  </script>
</body>
</html>
