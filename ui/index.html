<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PokeIdle Multiview</title>
  <style>
    :root {
      --bg: #16181d;
      --chip: #23262e;
      --chip-active: #3a4150;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
    .bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 6px; }
    #hide { width: 26px; color: var(--accent); font-size: 14px; }
    .bar > * { flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--accent);
      margin-right: 6px; }
    .brand .logo { width: 20px; height: 20px; display: block; }
    @media (max-width: 900px) { .brand { display: none; } }
    button { background: var(--chip); color: var(--text); border: 0; border-radius: 6px;
      height: 28px; padding: 0 10px; font: inherit; cursor: pointer; }
    button:hover { background: var(--chip-active); }
    button:disabled { opacity: .4; cursor: default; }
    #grid.on { background: var(--chip-active); }
    /* Economy mode: a soft green while it's on. */
    #eco.on { background: rgba(61, 220, 132, .16); color: #8fe0b0; box-shadow: inset 0 0 0 1px rgba(61, 220, 132, .45); }
    button.icon { width: 30px; padding: 0; font-size: 16px; }
    /* "+ SLOT" asks what the new slot runs: the game and its streams, the game only, or
       streams only. */
    .addpick { display: inline-flex; align-items: center; gap: 4px; padding: 0 2px; border-radius: 8px;
      box-shadow: inset 0 0 0 1px var(--accent); height: 32px; }
    .addpick[hidden] { display: none; }
    .addpick button { height: 26px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .addpick button svg { width: 15px; height: 15px; flex: none; }
    .addpick #add-cancel { width: 26px; font-size: 15px; color: var(--muted); background: transparent; }
    .addpick #add-cancel:hover { color: var(--text); background: var(--chip); }
    /* Quick switch between slots (each slot's own controls are in its header). */
    /* Padded, and the active ring is drawn inside the button: a scrolling strip cuts off
       anything that sticks out of it (an outline did). */
    .bar > .slots { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto;
      scrollbar-width: none; padding: 3px 2px; }
    .slots button { flex-shrink: 0; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--muted); background: transparent; }
    .slots button:hover { color: var(--text); background: var(--chip); }
    .slots button.active { color: var(--text); background: var(--chip-active); box-shadow: inset 0 0 0 1px var(--accent); }
    .slots .key { opacity: .6; margin-right: 5px; font-size: 11px; }
    /* Right side: sections (extensions · resources · languages · options), same spacing
       everywhere and a thin divider between them. An empty section (no measurement yet) hides
       with its divider. */
    .sections { display: flex; align-items: center; height: 100%; }
    .section { display: flex; align-items: center; gap: 6px; padding: 0 12px; position: relative; height: 28px; }
    .section:last-child { padding-right: 0; }
    .section:empty { display: none; }
    .section + .section::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px;
      background: var(--chip-active); }
    /* Extensions: each one's name with ✓ or ✗. */
    .ext { color: var(--muted); font-size: 12px; cursor: default; }
    .ext .mark { margin-left: 4px; font-weight: 700; }
    .ext.ok .mark { color: #3ddc84; }
    .ext.missing .mark { color: #ff8a80; }
    /* What the whole app uses (app + its WebView2 processes). */
    .meter { gap: 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; cursor: default; }
    .meter b { color: var(--text); font-weight: 600; margin-left: 4px; }
    .meter .busy b { color: #ffb74d; }
    .meter .high b { color: #ff8a80; }
    @media (max-width: 760px) { .meter { display: none; } }
    /* Support: just the heart, the size of a flag button. */
    #support { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: #ff6b81; }
    #support:hover { background: var(--chip); color: #ff8fa0; }
    #support svg { width: 17px; height: 17px; display: block; }
    /* Team analysis: a Pokéball line icon, the size and look of ⚙ beside it. */
    #team { display: inline-flex; align-items: center; justify-content: center; position: relative; }
    #team svg { width: 16px; height: 16px; display: block; }
    /* New feature: the Pokéball glows gold (a slow pulse) until it's opened once. */
    #team.is-new { color: var(--accent); animation: team-glow 2.2s ease-in-out infinite; }
    #team.is-new svg { animation: team-glow-icon 2.2s ease-in-out infinite; }
    @keyframes team-glow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(242, 193, 78, .35), 0 0 4px rgba(242, 193, 78, .15); }
      50% { box-shadow: 0 0 0 1px rgba(242, 193, 78, .85), 0 0 7px 1px rgba(242, 193, 78, .6); }
    }
    @keyframes team-glow-icon {
      0%, 100% { filter: drop-shadow(0 0 1px rgba(242, 193, 78, .4)); }
      50% { filter: drop-shadow(0 0 5px rgba(242, 193, 78, .95)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #team.is-new, #team.is-new svg { animation: none; }
      #team.is-new { box-shadow: 0 0 0 1px rgba(242, 193, 78, .7), 0 0 8px rgba(242, 193, 78, .4); }
    }
    .error { color: #ff8a80; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { color: var(--muted); }
    /* A platform's live checks all fail: red like a slot's game warning; click checks again. */
    .checks { display: flex; gap: 6px; }
    .checks:empty { display: none; }
    button.checks-down { color: #ff8a80; font-weight: 600; background: rgba(255, 138, 128, .14);
      box-shadow: inset 0 0 0 1px rgba(255, 138, 128, .55); border-radius: 11px; white-space: nowrap; }
    button.checks-down:hover { background: rgba(255, 138, 128, .26); }
    @media (max-width: 900px) { button.checks-down .names { display: none; } }
    /* A newer version: bright, so it's seen. */
    .update { background: var(--accent); color: #1a1408; font-weight: 600; }
    .update:hover { background: #ffd76b; }
    .update.armed { background: #3ddc84; }
    .update:disabled { opacity: 1; cursor: progress; }
    /* Language flags: the active one bright, the other dimmed. */
    .flags { gap: 4px; }
    .flag { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; opacity: .45; }
    .flag:hover { opacity: .8; background: var(--chip); }
    .flag.on { opacity: 1; background: var(--chip); }
    .flag svg { width: 20px; height: 14px; display: block; border-radius: 2px; }
  </style>
  <script src="i18n.js"></script>
  <script src="shortcuts.js"></script>
</head>
<body>
  <div class="bar">
    <!-- Top-left corner, same place as the ▾ that brings the bar back. -->
    <button id="hide" class="icon" data-i18n-title title="Hide this bar to give the slots more room (▾ in the same corner brings it back)">▴</button>
    <span class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="27" fill="#f4f6f9"/>
        <path d="M5 32a27 27 0 0 1 54 0z" fill="#ee2b3b"/>
        <rect x="5" y="29" width="54" height="6" fill="#1c1f26"/>
        <circle cx="32" cy="32" r="28.5" fill="none" stroke="#1c1f26" stroke-width="3"/>
        <circle cx="32" cy="32" r="10" fill="#1c1f26"/>
        <circle cx="32" cy="32" r="6.5" fill="#f4f6f9"/>
        <ellipse cx="22" cy="15" rx="8" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-32 22 15)"/>
      </svg>
      PokeIdle Multiview
    </span>
    <button id="add">+ SLOT</button>
    <span class="addpick" id="addpick" hidden>
      <button id="add-both"></button>
      <button id="add-game"></button>
      <button id="add-streams"></button>
      <button id="add-cancel" class="icon">×</button>
    </span>
    <button id="grid" data-i18n-title title="Grid: show all slots (click a slot's name to show it fullscreen instead)">GRID</button>
    <button id="eco">ECO</button>
    <div class="slots" id="slots"></div>
    <span class="checks" id="checks"></span>
    <span class="error" id="error"></span>
    <div class="sections">
    <span class="section exts"><span class="ext" id="hunt"></span></span>
    <span class="section meter" id="meter"></span>
    <span class="section flags">
      <button class="flag" data-lang="pt" title="Português (Brasil)" aria-label="Português (Brasil)">
        <svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009c3b"/><path d="M10 1.6 18.2 7 10 12.4 1.8 7z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.1" fill="#002776"/><path d="M7.1 6.4c2-.7 4.1-.4 5.9.8" stroke="#fff" stroke-width=".6" fill="none"/></svg>
      </button>
      <button class="flag" data-lang="en" title="English" aria-label="English">
        <svg viewBox="0 0 19 13" aria-hidden="true"><rect width="19" height="13" fill="#fff"/><path d="M0 0h19v1H0zm0 2h19v1H0zm0 2h19v1H0zm0 2h19v1H0zm0 2h19v1H0zm0 2h19v1H0zm0 2h19v1H0z" fill="#b22234"/><rect width="8" height="7" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.5" cy="1.4" r=".45"/><circle cx="4" cy="1.4" r=".45"/><circle cx="6.5" cy="1.4" r=".45"/><circle cx="2.75" cy="2.8" r=".45"/><circle cx="5.25" cy="2.8" r=".45"/><circle cx="1.5" cy="4.2" r=".45"/><circle cx="4" cy="4.2" r=".45"/><circle cx="6.5" cy="4.2" r=".45"/><circle cx="2.75" cy="5.6" r=".45"/><circle cx="5.25" cy="5.6" r=".45"/></g></svg>
      </button>
      <button class="flag" data-lang="es" title="Español" aria-label="Español">
        <svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#aa151b"/><rect y="3.5" width="20" height="7" fill="#f1bf00"/><rect x="4.4" y="5.2" width="2.4" height="3.4" rx=".5" fill="#aa151b" opacity=".85"/><rect x="4.1" y="4.7" width="3" height=".7" rx=".3" fill="#ad1519" opacity=".7"/></svg>
      </button>
    </span>
    <span class="section options">
      <button id="update" class="update" hidden></button>
      <button id="support" data-i18n-title title="Support the dev: Pix and Discord" aria-label="Support the dev"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.2 10.6 20C5.4 15.4 2 12.4 2 8.6 2 5.5 4.4 3.2 7.4 3.2c1.7 0 3.4.8 4.6 2.1 1.2-1.3 2.9-2.1 4.6-2.1 3 0 5.4 2.3 5.4 5.4 0 3.8-3.4 6.8-8.6 11.4z"/></svg></button>
      <button id="team" class="icon" title="Team analysis: which Pokémon are worth leveling" aria-label="Team analysis"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h6m6 0h6"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="settings" class="icon" data-i18n-title title="Settings">⚙</button>
    </span>
    </div>
  </div>
  <script>
    // App-wide controls. Each slot's controls and stream pills live in its own header
    // (slot.html), on top of the slot.
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { t } = I18N;
    const slots = document.getElementById('slots');
    const addBtn = document.getElementById('add');
    let latest = null;

    function showError(err) {
      const el = document.getElementById('error');
      el.textContent = I18N.text(String(err));
      clearTimeout(showError.timer);
      showError.timer = setTimeout(() => { el.textContent = ''; }, 6000);
    }

    const slotName = (slot) => slot.name || `Slot ${slot.id}`;

    function render(state) {
      latest = state;
      document.getElementById('grid').classList.toggle('on', state.focus == null && !state.economy);
      const eco = document.getElementById('eco');
      eco.classList.toggle('on', !!state.economy);
      const ecoKeys = Shortcuts.keys('economy');
      eco.title = (state.economy
        ? t('Economy mode is on: the accounts keep running hidden. Click to show them again')
        : t('Economy mode: hides every account (they keep running) to save CPU, and shows a light screen with what needs you')) + (ecoKeys ? ` (${ecoKeys})` : '');
      slots.replaceChildren(...state.slots.map((slot) => {
        const focused = state.focus === slot.id && !state.economy;
        const b = document.createElement('button');
        const keys = Shortcuts.keys(`focus${slot.id}`);
        b.title = `${focused ? t('Back to the grid') : t('Show {name} fullscreen', { name: slotName(slot) })}${keys ? ` (${keys})` : ''}`;
        const key = document.createElement('span');
        key.className = 'key';
        key.textContent = slot.id;
        b.append(key, slotName(slot));
        if (focused) b.classList.add('active');
        b.addEventListener('click', () => invoke('focus_slot', { id: slot.id }).catch(showError));
        return b;
      }));
      // One chip for every platform whose live checks fail ("⚠ Twitch · Kick"; just ⚠ when the
      // bar is narrow), each one's reason in the tooltip.
      const down = I18N.checksDown(state);
      const checks = document.getElementById('checks');
      if (down.length) {
        const b = document.createElement('button');
        b.className = 'checks-down';
        b.append('⚠', Object.assign(document.createElement('span'), { className: 'names', textContent: ` ${down.map((c) => c.name).join(' · ')}` }));
        b.title = `${down.map((c) => `${c.title}\n${c.detail}`).join('\n\n')}\n\n${t('Click to check again')}`;
        b.addEventListener('click', () => invoke('check_streams_now').catch(showError));
        checks.replaceChildren(b);
      } else {
        checks.replaceChildren();
      }
      addBtn.disabled = state.slots.length >= state.max_slots;
      addBtn.title = t('Add a slot (another account, up to 4)');
      const hunt = document.getElementById('hunt');
      hunt.className = 'ext ' + (state.hunt_dir ? 'ok' : 'missing');
      hunt.replaceChildren('/hunt', Object.assign(document.createElement('span'), { className: 'mark', textContent: state.hunt_dir ? '✓' : '✗' }));
      hunt.title = state.hunt_dir
        ? t('"/hunt for PokeIdle" extension loaded')
        : t('"/hunt for PokeIdle" not found in any installed browser');
    }

    // Flags: the app's language (saved; every page switches at once).
    const flags = [...document.querySelectorAll('.flag')];
    const markFlags = () => flags.forEach((f) => f.classList.toggle('on', f.dataset.lang === I18N.lang));
    flags.forEach((f) => f.addEventListener('click', () => {
      I18N.set(f.dataset.lang);
      invoke('set_language', { lang: f.dataset.lang }).catch(showError);
    }));
    markFlags();
    I18N.onChange(() => { markFlags(); if (latest) render(latest); });

    // ⬆ <version>: a newer release. First click asks, the second (within 4 s) installs it and
    // the app reopens on its own; the portable exe opens the release page instead.
    const updateBtn = document.getElementById('update');
    let update = null;
    function renderUpdate(u) {
      update = u || update;
      const v = update;
      updateBtn.hidden = !v?.available;
      if (!v?.available) return;
      updateBtn.disabled = v.progress != null;
      if (v.progress != null) {
        updateBtn.textContent = t('Downloading {pct}%', { pct: v.progress });
      } else if (!updateBtn.classList.contains('armed')) {
        updateBtn.textContent = `⬆ ${v.available}`;
      }
      updateBtn.title = v.can_install
        ? t('Version {v} is out: click to update (the app closes, installs it and opens again)', { v: v.available })
        : t('Version {v} is out: click to open its download page', { v: v.available });
      if (v.error) updateBtn.title += `\n${v.error}`;
    }
    updateBtn.addEventListener('click', () => {
      if (!update?.can_install) { invoke('install_update').catch(showError); return; }
      if (!updateBtn.classList.contains('armed')) {
        updateBtn.classList.add('armed');
        updateBtn.textContent = t('Update now?');
        setTimeout(() => { updateBtn.classList.remove('armed'); renderUpdate(); }, 4000);
        return;
      }
      updateBtn.classList.remove('armed');
      invoke('install_update').catch(showError);
    });
    listen('update', (e) => renderUpdate(e.payload));
    invoke('get_update').then(renderUpdate);
    I18N.onChange(() => renderUpdate());

    // "+ SLOT": first what it runs, right there in the bar (a menu wouldn't fit the strip):
    // the game and its streams (the usual), the game only (no streams), or streams only, for an
    // account whose game runs on another computer. Esc, ×, or a few seconds without a choice
    // put "+ SLOT" back.
    const addPick = document.getElementById('addpick');
    const ICON_GAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/></svg>';
    const ICON_STREAMS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor" stroke="none"/><path d="M8.5 3l3.5 3 3.5-3"/></svg>';
    // Game + streams: the controller with a little "on air" screen at its corner.
    const ICON_BOTH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 10h-7a4 4 0 0 0 0 8h11a4 4 0 0 0 4-4"/><path d="M6.5 12.5v3M5 14h3"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor" stroke="none"/><rect x="15.5" y="2.5" width="7" height="6" rx="1.5" stroke-width="1.7"/><path d="M18.3 4.1v2.8l2.3-1.4z" fill="currentColor" stroke="none"/></svg>';
    const ADD_MODES = [
      ['add-both', 'both', ICON_BOTH, 'Game + streams', 'The usual: this account\'s game, with its Twitch and Kick streams'],
      ['add-game', 'game', ICON_GAME, 'Game only', 'Only this account\'s game: no Twitch or Kick streams, chests or redeems (lighter on the PC)'],
      ['add-streams', 'streams', ICON_STREAMS, 'Streams only', 'For an account whose game runs on another computer: only its streams, chests and bonus redeems run here'],
    ];
    let pickTimer = 0;
    function renderPick() {
      for (const [btnId, , icon, label, title] of ADD_MODES) {
        const b = document.getElementById(btnId);
        b.innerHTML = icon;
        b.append(t(label));
        b.title = t(title);
      }
      document.getElementById('add-cancel').title = t('Cancel');
    }
    function showPick(on) {
      clearTimeout(pickTimer);
      addPick.hidden = !on;
      addBtn.hidden = on;
      if (on) {
        renderPick();
        pickTimer = setTimeout(() => showPick(false), 8000);
      }
    }
    function addSlot(mode) {
      showPick(false);
      invoke('add_slot', { mode }).catch(showError);
    }
    addBtn.addEventListener('click', () => showPick(true));
    for (const [btnId, mode] of ADD_MODES) document.getElementById(btnId).addEventListener('click', () => addSlot(mode));
    document.getElementById('add-cancel').addEventListener('click', () => showPick(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !addPick.hidden) showPick(false); });
    I18N.onChange(() => { if (!addPick.hidden) renderPick(); });
    document.getElementById('grid').addEventListener('click', () => invoke('focus_slot', { id: null }).catch(showError));
    document.getElementById('eco').addEventListener('click', () => invoke('set_economy', { on: !(latest && latest.economy) }).catch(showError));
    document.getElementById('settings').addEventListener('click', () => invoke('open_settings').catch(showError));
    // Team analysis is new: marked until it's opened once (remembered by this page).
    const teamBtn = document.getElementById('team');
    let teamSeen = false;
    try { teamSeen = localStorage.getItem('team-seen') === '1'; } catch {}
    const teamTitle = () => {
      teamBtn.classList.toggle('is-new', !teamSeen);
      teamBtn.title = t('Team analysis: which Pokémon are worth leveling') + (teamSeen ? '' : ` — ${t('New!')}`);
    };
    teamTitle();
    I18N.onChange(teamTitle);
    teamBtn.addEventListener('click', () => {
      if (!teamSeen) {
        teamSeen = true;
        try { localStorage.setItem('team-seen', '1'); } catch {}
        teamTitle();
      }
      invoke('open_team').catch(showError);
    });
    document.getElementById('support').addEventListener('click', () => invoke('open_support').catch(showError));
    document.getElementById('hide').addEventListener('click', () => invoke('set_toolbar_hidden', { hidden: true }).catch(showError));
    Shortcuts.onChange(() => { if (latest) render(latest); });

    // --- Resource meter: CPU and memory of the whole app, every couple of seconds ------------
    const meter = document.getElementById('meter');
    function size(bytes) {
      const gb = bytes / 1024 ** 3;
      return gb >= 1 ? `${gb.toFixed(gb >= 10 ? 0 : 1)} GB` : `${Math.round(bytes / 1024 ** 2)} MB`;
    }
    function renderMeter(u) {
      const cpu = document.createElement('span');
      cpu.className = u.cpu >= 60 ? 'high' : u.cpu >= 30 ? 'busy' : '';
      cpu.append('CPU ', Object.assign(document.createElement('b'), { textContent: `${Math.round(u.cpu)}%` }));
      const ram = document.createElement('span');
      ram.append('RAM ', Object.assign(document.createElement('b'), { textContent: size(u.memory) }));
      meter.replaceChildren(cpu, ram);
      meter.title = t('What the app uses right now, games and streams included ({n} processes), like Task Manager shows it. CPU: share of the whole PC.', { n: u.processes });
    }
    listen('resources', (e) => renderMeter(e.payload));

    listen('state', (e) => render(e.payload));
    listen('error', (e) => showError(e.payload));
    invoke('get_state').then(render);
  </script>
</body>
</html>
