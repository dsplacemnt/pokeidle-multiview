<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PokeIdle Multiview</title>
  <style>
    :root {
      --bg: #16181d;
      --chip: #23262e;
      --chip-active: #3a4150;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
    .bar { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 10px; }
    .bar > * { flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--accent);
      margin-right: 6px; }
    .brand .logo { width: 20px; height: 20px; display: block; }
    @media (max-width: 1100px) { .brand { display: none; } }
    button { background: var(--chip); color: var(--text); border: 0; border-radius: 6px;
      height: 28px; padding: 0 10px; font: inherit; cursor: pointer; }
    button:hover { background: var(--chip-active); }
    button:disabled { opacity: .4; cursor: default; }
    /* Takes the free space; scrolls sideways (no visible bar) if 4 chips still don't fit. */
    .bar > .chips { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px;
      overflow-x: auto; scrollbar-width: none; }
    .chip .armed { background: #8a2c2c; }
    .chip .platform { position: relative; display: inline-flex; align-items: center;
      justify-content: center; width: 28px; padding: 0; border-radius: 5px; }
    .chip .platform svg { width: 18px; height: 18px; display: block; }
    .chip .platform.panel-open { background: var(--chip-active); outline: 1px solid var(--accent); }
    /* Dot = this platform's stream keeps running in the background. */
    .chip .platform.running::after { content: ''; position: absolute; right: 2px; bottom: 2px;
      width: 7px; height: 7px; border-radius: 50%; background: #3ddc84;
      box-shadow: 0 0 0 1.5px var(--chip); }
    .error { color: #ff8a80; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip { display: flex; flex-shrink: 0; align-items: center; gap: 0; background: var(--chip);
      border-radius: 8px; padding: 2px; }
    .chip.active { background: var(--chip-active); outline: 1px solid var(--accent); }
    .chip button { background: transparent; height: 24px; padding: 0 5px; }
    .chip .zoom { color: var(--muted); min-width: 32px; text-align: center; }
    .status { color: var(--muted); }
    #grid.on { background: var(--chip-active); }
    button.icon { width: 30px; padding: 0; font-size: 16px; }
    .chip .name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .chip .muted { opacity: .75; }
    .chip input.rename { width: 120px; height: 24px; margin: 0 2px; padding: 0 6px; border-radius: 5px;
      border: 1px solid var(--accent); background: #101216; color: var(--text); font: inherit; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="27" fill="#f4f6f9"/>
        <path d="M5 32a27 27 0 0 1 54 0z" fill="#ee2b3b"/>
        <rect x="5" y="29" width="54" height="6" fill="#1c1f26"/>
        <circle cx="32" cy="32" r="28.5" fill="none" stroke="#1c1f26" stroke-width="3"/>
        <circle cx="32" cy="32" r="10" fill="#1c1f26"/>
        <circle cx="32" cy="32" r="6.5" fill="#f4f6f9"/>
        <ellipse cx="22" cy="15" rx="8" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-32 22 15)"/>
      </svg>
      PokeIdle Multiview
    </span>
    <button id="add">+ Slot</button>
    <button id="grid" title="Grid: all slots the same size (click a slot's name to focus it instead)">Grid</button>
    <div class="chips" id="chips"></div>
    <span class="error" id="error"></span>
    <span class="status" id="hunt"></span>
    <button id="settings" class="icon" title="Settings">⚙</button>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const chips = document.getElementById('chips');
    const addBtn = document.getElementById('add');

    function button(text, title, onClick) {
      const b = document.createElement('button');
      b.textContent = text;
      b.title = title;
      b.addEventListener('click', onClick);
      return b;
    }

    function showError(err) {
      const el = document.getElementById('error');
      el.textContent = String(err);
      clearTimeout(showError.timer);
      showError.timer = setTimeout(() => { el.textContent = ''; }, 6000);
    }

    // Native confirm() is drawn inside this 40px-tall webview and gets cut off, so closing
    // asks inline instead: the first click arms the button, a second one within 3 s closes.
    function closeButton(id) {
      const b = button('×', 'Close slot (keeps its login)', () => {
        if (b.classList.contains('armed')) {
          invoke('close_slot', { id }).catch(showError);
          return;
        }
        b.classList.add('armed');
        b.textContent = 'Close?';
        setTimeout(() => {
          b.classList.remove('armed');
          b.textContent = '×';
        }, 3000);
      });
      return b;
    }

    // Simplified platform marks, drawn inline so the toolbar needs no image files.
    const PLATFORMS = {
      twitch: {
        name: 'Twitch',
        svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9146FF" d="M4.3 2 2.5 6.5V20h5v2.5h2.8l2.5-2.5h4l4.7-4.7V2H4.3Z"/><path fill="#fff" d="M19.5 14.2 16.7 17h-4.5l-2.5 2.5V17H5.5V4h14v10.2Z"/><path fill="#9146FF" d="M15.2 7.2h2v5.6h-2zM10.6 7.2h2v5.6h-2z"/></svg>`,
      },
      kick: {
        name: 'Kick',
        svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#53FC18"/><path fill="#0B0E0F" d="M5.5 4.5h5v4h1.7V6.6h1.9V4.5h4.4v5.3h-2.1v1.9h-1.9v.6h1.9v1.9h2.1v5.3h-4.4v-2.1h-1.9v-1.9h-1.7v4h-5z"/></svg>`,
      },
    };

    // Opens the platform's site in place of the game, in this slot's session (log in there).
    // Going back to the game leaves it running hidden and muted; ⏹ closes it for good.
    function panelButton(id, platform, panels) {
      const { svg, name } = PLATFORMS[platform];
      const shown = panels?.front === platform;
      const running = panels?.running?.includes(platform);
      const title = shown
        ? `Back to the game (${name} keeps running muted)`
        : running
          ? `${name} is running in the background — click to show it`
          : `Open ${name} in this slot (log in here)`;
      const b = button('', title, () => invoke('toggle_panel', { id, platform }).catch(showError));
      b.classList.add('platform');
      b.innerHTML = svg;
      b.setAttribute('aria-label', title);
      if (shown) b.classList.add('panel-open');
      if (running && !shown) b.classList.add('running');
      return b;
    }

    function stopButton(id, panels) {
      if (!panels?.front) return [];
      const { name } = PLATFORMS[panels.front];
      return [button('⏹', `Stop ${name} in this slot`,
        () => invoke('stop_panel', { id, platform: panels.front }).catch(showError))];
    }

    const slotName = (slot) => slot.name || `Slot ${slot.id}`;

    // Click = focus the slot (large, others in a side column; again = grid).
    // Double-click = rename it in place (Enter saves, Esc cancels, empty = default name).
    let editing = null;
    let latest = null;
    function nameButton(slot, focused) {
      const b = button(slotName(slot), `${focused ? 'Back to the grid' : 'Focus this slot'} (Ctrl+${slot.id}) · double-click to rename`, () => {
        clearTimeout(b.clickTimer);
        b.clickTimer = setTimeout(() => invoke('focus_slot', { id: slot.id }).catch(showError), 220);
      });
      b.classList.add('name');
      b.addEventListener('dblclick', () => {
        clearTimeout(b.clickTimer);
        editing = slot.id;
        const input = document.createElement('input');
        input.className = 'rename';
        input.value = slot.name || '';
        input.placeholder = `Slot ${slot.id}`;
        input.maxLength = 40;
        let done = false;
        const finish = (saveIt) => {
          if (done) return;
          done = true;
          editing = null;
          const next = saveIt ? invoke('rename_slot', { id: slot.id, name: input.value }) : Promise.resolve();
          next.catch(showError).finally(() => { if (latest) render(latest); });
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') finish(true);
          if (e.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        b.replaceWith(input);
        input.focus();
        input.select();
      });
      return b;
    }

    function muteButton(slot) {
      const b = button(slot.muted ? '🔇' : '🔊', slot.muted ? 'Unmute this game' : 'Mute this game',
        () => invoke('toggle_mute', { id: slot.id }).catch(showError));
      if (slot.muted) b.classList.add('muted');
      return b;
    }

    function render(state) {
      latest = state;
      if (editing !== null) return; // don't replace the rename box while typing
      document.getElementById('grid').classList.toggle('on', state.focus == null);
      chips.replaceChildren();
      for (const slot of state.slots) {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.focus === slot.id ? ' active' : '');
        const zoom = document.createElement('span');
        zoom.className = 'zoom';
        zoom.textContent = Math.round(slot.zoom * 100) + '%';
        chip.append(
          nameButton(slot, state.focus === slot.id),
          muteButton(slot),
          button('−', 'Zoom out', () => invoke('set_zoom', { id: slot.id, zoom: slot.zoom - 0.1 }).catch(showError)),
          zoom,
          button('+', 'Zoom in', () => invoke('set_zoom', { id: slot.id, zoom: slot.zoom + 0.1 }).catch(showError)),
          ...['twitch', 'kick'].map((platform) => panelButton(slot.id, platform, state.panels[slot.id])),
          ...stopButton(slot.id, state.panels[slot.id]),
          button('⟳', 'Reload', () => invoke('reload_slot', { id: slot.id }).catch(showError)),
          closeButton(slot.id),
        );
        chips.append(chip);
      }
      addBtn.disabled = state.slots.length >= state.max_slots;
      const hunt = document.getElementById('hunt');
      hunt.textContent = state.hunt_dir ? '/hunt ✓' : '/hunt ✗';
      hunt.title = state.hunt_dir
        ? '"/hunt for PokeIdle" extension loaded'
        : '"/hunt for PokeIdle" not found in any installed browser';
    }

    addBtn.addEventListener('click', () => invoke('add_slot').catch(showError));
    document.getElementById('grid').addEventListener('click', () => invoke('focus_slot', { id: null }).catch(showError));
    document.getElementById('settings').addEventListener('click', () => invoke('open_settings').catch(showError));
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key >= '1' && e.key <= '4') invoke('focus_slot', { id: Number(e.key) }).catch(showError);
    });

    listen('state', (e) => render(e.payload));
    invoke('get_state').then(render);
  </script>
</body>
</html>
