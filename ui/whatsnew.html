<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What's new</title>
  <style>
    :root {
      --bg: #14161b;
      --card: #1d2027;
      --chip: #262a33;
      --chip-active: #333845;
      --line: #2e333d;
      --text: #e6e8ee;
      --muted: #8b91a1;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #3a4150 transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13.5px/1.5 "Segoe UI", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 20px 22px 12px; display: grid; gap: 4px; flex: none; }
    h1 { margin: 0; font-size: 19px; color: var(--accent); }
    header p { margin: 0; color: var(--muted); }
    main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 12px; display: grid; gap: 12px; align-content: start; }
    .card { background: var(--card); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset; }
    .card.older { opacity: .8; }
    .head { display: flex; align-items: baseline; gap: 10px; }
    .head b { font-size: 15px; }
    .head .date { color: var(--muted); font-size: 12px; }
    .head .tag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
      background: rgba(242, 193, 78, .14); color: var(--accent); }
    ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
    li::marker { color: var(--accent); }
    footer { flex: none; display: flex; gap: 8px; padding: 12px 22px 16px; border-top: 1px solid var(--line); }
    footer .grow { flex: 1; }
    button { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
      height: 34px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: var(--chip-active); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; }
    button.primary:hover { background: #ffd76b; border-color: #ffd76b; }
    button.link { background: transparent; border: 0; color: var(--muted); padding: 0 4px; font-weight: 500; text-decoration: underline; }
    button.link:hover { color: var(--text); background: transparent; }
  </style>
  <script src="i18n.js"></script>
  <script src="changelog.js"></script>
</head>
<body>
  <header>
    <h1 data-i18n>What's new</h1>
    <p id="sub"></p>
  </header>
  <main id="list"></main>
  <footer>
    <button id="older" class="link" data-i18n>Show older versions</button>
    <span class="grow"></span>
    <button id="close" class="primary" data-i18n>Got it</button>
  </footer>
  <script>
    // The patch notes of the versions newer than the one used before the update (or all of
    // them, when opened from ⚙ → About). Text only: nothing is fetched.
    const { invoke } = window.__TAURI__.core;
    const { t } = I18N;
    let info = { current: '', since: null };
    let showAll = false;

    // "0.12.1" → [0, 12, 1], compared part by part.
    const parts = (v) => String(v).split('.').map((n) => Number(n) || 0);
    function newer(a, b) {
      const x = parts(a), y = parts(b);
      for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
      return false;
    }

    function render() {
      const lang = I18N.lang || 'en';
      const recent = window.CHANGELOG.filter((e) => !info.since || newer(e.version, info.since));
      const shown = showAll || !info.since ? window.CHANGELOG : recent;
      document.getElementById('sub').textContent = info.since
        ? t('Updated from {from} to {to}.', { from: info.since, to: info.current })
        : t('Version {to}.', { to: info.current });
      document.getElementById('older').style.display = info.since && !showAll && recent.length < window.CHANGELOG.length ? '' : 'none';
      document.getElementById('list').replaceChildren(...shown.map((entry) => {
        const card = document.createElement('section');
        card.className = 'card' + (info.since && !recent.includes(entry) ? ' older' : '');
        const head = document.createElement('div');
        head.className = 'head';
        head.append(Object.assign(document.createElement('b'), { textContent: entry.version }),
          Object.assign(document.createElement('span'), { className: 'date', textContent: entry.date }));
        if (entry.version === info.current) head.append(Object.assign(document.createElement('span'), { className: 'tag', textContent: t('this version') }));
        const ul = document.createElement('ul');
        for (const note of entry.notes[lang] || entry.notes.en) ul.append(Object.assign(document.createElement('li'), { textContent: note }));
        card.append(head, ul);
        return card;
      }));
    }

    document.getElementById('close').addEventListener('click', () => invoke('close_window'));
    document.getElementById('older').addEventListener('click', () => { showAll = true; render(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('close_window'); });
    I18N.onChange(render);
    invoke('get_whats_new').then((v) => { info = v; render(); });
  </script>
</body>
</html>
