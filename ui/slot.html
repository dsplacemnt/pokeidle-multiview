<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slot header</title>
  <style>
    :root {
      --bg: #16181d;
      --chip: #23262e;
      --chip-active: #3a4150;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
    body { border-top: 2px solid transparent; }
    body.focused { border-top-color: var(--accent); }
    /* One row: the slot's controls (as wide as they need, at most 60%) | divider | its streams,
       which get all the rest. Each part scrolls sideways when it doesn't fit. */
    .bar { display: flex; align-items: center; height: 30px; }
    .half { min-width: 0; height: 100%; display: flex; align-items: center; }
    .half.left { flex: 0 1 auto; max-width: 60%; }
    .half.streams { flex: 1 1 0; position: relative; }
    .divider { flex: none; width: 2px; height: 20px; border-radius: 1px; background: var(--chip-active); }
    .row { display: flex; align-items: center; gap: 2px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; }
    .row > * { flex-shrink: 0; }
    .controls { flex: 1 1 auto; min-width: 0; height: 100%; padding: 0 6px; }
    .streams { padding: 0 4px 0 6px; gap: 4px; }
    .streams > * { flex-shrink: 0; }
    .pills { flex: 1 1 auto; min-width: 0; height: 100%; gap: 5px; padding: 0 2px; }
    /* When the pills don't fit: the hidden side fades out and gets an arrow that scrolls it. */
    .pillbox { flex: 1 1 auto; min-width: 0; height: 100%; position: relative; display: flex; }
    .pillbox.more-left .pills { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 36px); }
    .pillbox.more-right .pills { -webkit-mask-image: linear-gradient(to left, transparent 0, #000 36px); }
    .pillbox.more-left.more-right .pills { -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%); }
    .scroll { position: absolute; top: 4px; width: 22px; height: 22px; padding: 0; border-radius: 11px;
      display: none; align-items: center; justify-content: center; z-index: 1;
      background: var(--chip-active); color: var(--accent); font-size: 14px; font-weight: 700; }
    .scroll.left { left: 0; }
    .scroll.right { right: 0; }
    .pillbox.more-left .scroll.left, .pillbox.more-right .scroll.right { display: inline-flex; }
    .scroll:hover { background: var(--accent); color: #0b0e0f; }
    .empty { color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 4px; }
    /* Pills grouped by platform (Twitch, then Kick), with a divider between the groups. */
    .pills .group { display: inline-flex; flex-shrink: 0; align-items: center; gap: 5px; }
    .pills .gsep { flex: none; width: 2px; height: 16px; border-radius: 1px; background: var(--chip-active);
      margin: 0 3px; }
    button { background: transparent; color: var(--text); border: 0; border-radius: 5px;
      height: 24px; padding: 0 6px; font: inherit; cursor: pointer; }
    button:hover { background: var(--chip-active); }
    .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; background: var(--chip); }
    body.focused .name { background: var(--chip-active); box-shadow: inset 0 0 0 1px var(--accent); }
    /* A new version (only here while the top bar is hidden). */
    button.update { background: var(--accent); color: #1a1408; font-weight: 600; margin-right: 4px; }
    button.update:hover { background: #ffd76b; }
    button.update.armed { background: #3ddc84; }
    .showbar { width: 26px; padding: 0; margin-right: 4px; background: var(--chip); color: var(--accent);
      font-size: 14px; }
    .sep { width: 1px; height: 16px; background: var(--chip-active); margin: 0 4px; }
    /* Running bonuses: small colored chips with the time left. */
    .bonuses { display: inline-flex; gap: 8px; margin-left: 4px; }
    .bonuses:empty { display: none; }
    .bgroup { display: inline-flex; align-items: center; gap: 3px; padding: 0 2px; }
    .bgroup + .bgroup { border-left: 1px solid var(--chip-active); padding-left: 8px; }
    .bmark { display: inline-flex; width: 14px; height: 14px; margin-right: 1px; }
    .bmark svg { width: 14px; height: 14px; display: block; }
    /* IdleHub vote reminder: muted countdown, bright when the vote is ready. */
    .votebox { display: inline-flex; margin-left: 6px; }
    .votebox:empty { display: none; }
    .vote { height: 20px; padding: 0 9px; border-radius: 10px; font-size: 11.5px; font-weight: 600;
      color: var(--muted); background: var(--chip); font-variant-numeric: tabular-nums; }
    .vote.ready { color: #1a1408; background: var(--accent); animation: votepulse 2s ease-in-out infinite; }
    .vote.ready:hover { background: #ffd76b; }
    @keyframes votepulse { 50% { box-shadow: 0 0 0 3px rgba(242, 193, 78, .25); } }
    /* Daily Prey still to do (free roll or pick): violet like the Lure bonus. */
    .preybox { display: inline-flex; align-items: center; margin-left: 6px; border-radius: 10px;
      background: rgba(180, 120, 255, .16); box-shadow: inset 0 0 0 1px rgba(180, 120, 255, .5); }
    .preybox button { height: 20px; background: transparent; font-size: 11.5px; font-weight: 600; color: #e3c4ff; }
    button.prey { padding: 0 6px 0 9px; border-radius: 10px 0 0 10px; }
    button.prey-x { padding: 0 8px 0 5px; border-radius: 0 10px 10px 0; color: rgba(227, 196, 255, .6); }
    .preybox button:hover { background: rgba(180, 120, 255, .28); }
    button.prey-x:hover { color: #fff; }
    .bonus { height: 20px; padding: 0 7px; border-radius: 10px; display: inline-flex; align-items: center;
      font-size: 11.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: default; }
    .bonus.xp { color: #ffd76b; background: rgba(242, 193, 78, .14); }
    .bonus.capture { color: #8fd3ff; background: rgba(90, 170, 255, .14); }
    .bonus.lure { color: #d8a8ff; background: rgba(180, 120, 255, .16); }
    .bonus.none { color: var(--muted); background: transparent; border: 1px dashed var(--chip-active);
      font-weight: 500; }
    .muted { opacity: .75; }
    .panel-on { background: var(--chip-active); color: var(--accent); }
    .armed { background: #8a2c2c; }
    .spacer { flex: 1 1 auto; }
    .error { color: #ff8a80; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-left: 6px; }
    .platform { position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 28px; padding: 0; }
    .platform svg, .pick svg { width: 18px; height: 18px; display: block; }
    .platform.panel-open { background: var(--chip-active); box-shadow: inset 0 0 0 1px var(--accent); }
    /* Dot = this platform has a stream running in the background; a number = how many. */
    .platform.running::after { content: ''; position: absolute; right: 2px; bottom: 2px;
      width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 1.5px var(--bg); }
    .platform.running[data-count]::after { content: attr(data-count); width: auto; height: 11px;
      min-width: 11px; padding: 0 2px; right: 0; bottom: 0; border-radius: 6px; color: #0b0e0f;
      font: 700 9px/11px "Segoe UI", system-ui, sans-serif; text-align: center; }
    .add { font-size: 16px; width: 26px; padding: 0; color: var(--muted); }
    .add:hover, .add.open { color: var(--text); }
    .add.open { background: var(--chip-active); }
    .addbox { display: inline-flex; align-items: center; gap: 2px; margin-left: 2px; }
    .pick { width: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      opacity: .45; }
    .pick.on { opacity: 1; background: var(--chip); }
    input { width: 170px; height: 24px; margin: 0 2px; padding: 0 6px; border-radius: 5px;
      border: 1px solid var(--accent); background: #101216; color: var(--text); font: inherit; }
    .pill { display: inline-flex; align-items: center; background: var(--chip); border-radius: 12px; height: 22px;
      touch-action: none; }
    /* Hold and drag a pill sideways to move it. */
    .pill.dragging { opacity: .7; box-shadow: inset 0 0 0 1px var(--accent); cursor: grabbing; }
    .pill.dragging button { cursor: grabbing; }
    .pill.shown { background: var(--chip-active); box-shadow: inset 0 0 0 1px var(--accent); }
    /* ⚠: a stream the app couldn't fix by itself (details on hover). */
    .pill.warn { background: rgba(255, 138, 128, .14); box-shadow: inset 0 0 0 1px rgba(255, 138, 128, .55); }
    .pill .warn-icon { color: #ff8a80; font-size: 12px; margin-left: 1px; }
    .pill .follow-tip { color: var(--muted); font-size: 11px; margin-left: 1px; }
    /* Not logged in on a platform: one amber chip that opens the login, instead of its pills. */
    .login-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px 0 6px; border-radius: 11px;
      border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: #ffd27a; flex-shrink: 0;
      background: rgba(255, 183, 77, .12); box-shadow: inset 0 0 0 1px rgba(255, 183, 77, .45); transition: background .12s; }
    .login-chip:hover { background: rgba(255, 183, 77, .22); }
    /* The account's game dropped out: red, reloads on click. */
    button.game-issue { color: #ff8a80; font-weight: 600; background: rgba(255, 138, 128, .14);
      box-shadow: inset 0 0 0 1px rgba(255, 138, 128, .55); border-radius: 11px; margin: 0 2px; }
    button.game-issue:hover { background: rgba(255, 138, 128, .26); }
    .login-chip svg { width: 14px; height: 14px; display: block; }
    .login-chip .arrow { opacity: .7; font-weight: 500; }
    .pill button { height: 22px; border-radius: 11px; }
    .pill .show { display: inline-flex; align-items: center; gap: 5px; padding: 0 3px 0 7px; max-width: 160px; }
    .pill .show span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill .show svg { width: 14px; height: 14px; flex-shrink: 0; display: block; }
    .pill .stop { padding: 0 7px 0 3px; color: var(--muted); }
    .pill .stop:hover { color: var(--text); background: transparent; }
  </style>
  <script src="i18n.js"></script>
  <script src="shortcuts.js"></script>
</head>
<body>
  <div class="bar">
    <div class="half left"><div class="row controls" id="controls"></div></div>
    <div class="divider" data-i18n-title title="Left: this slot's controls · Right: its Twitch/Kick streams"></div>
    <div class="half streams" id="streams">
      <div class="pillbox" id="pillbox">
        <button class="scroll left" id="scroll-left" data-i18n-title title="Scroll the streams left">‹</button>
        <div class="row pills" id="pills"></div>
        <button class="scroll right" id="scroll-right" data-i18n-title title="Scroll the streams right">›</button>
      </div>
    </div>
  </div>
  <script>
    // One slot's header, on top of its tile: the slot's controls, and a pill per Twitch/Kick
    // stream running in it.
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { t } = I18N;
    const id = Number(new URLSearchParams(location.search).get('id'));
    const controls = document.getElementById('controls');
    const pills = document.getElementById('pills');
    const streams = document.getElementById('streams');
    const pillbox = document.getElementById('pillbox');

    // Simplified platform marks, drawn inline so the page needs no image files.
    const PLATFORMS = {
      twitch: {
        name: 'Twitch',
        svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9146FF" d="M4.3 2 2.5 6.5V20h5v2.5h2.8l2.5-2.5h4l4.7-4.7V2H4.3Z"/><path fill="#fff" d="M19.5 14.2 16.7 17h-4.5l-2.5 2.5V17H5.5V4h14v10.2Z"/><path fill="#9146FF" d="M15.2 7.2h2v5.6h-2zM10.6 7.2h2v5.6h-2z"/></svg>`,
      },
      kick: {
        name: 'Kick',
        svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#53FC18"/><path fill="#0B0E0F" d="M5.5 4.5h5v4h1.7V6.6h1.9V4.5h4.4v5.3h-2.1v1.9h-1.9v.6h1.9v1.9h2.1v5.3h-4.4v-2.1h-1.9v-1.9h-1.7v4h-5z"/></svg>`,
      },
    };

    function button(text, title, onClick, className) {
      const b = document.createElement('button');
      b.textContent = text;
      b.title = title;
      if (className) b.className = className;
      b.addEventListener('click', onClick);
      return b;
    }

    function showError(err) {
      const el = document.getElementById('error');
      if (!el) return;
      el.textContent = I18N.text(String(err));
      el.title = el.textContent;
      clearTimeout(showError.timer);
      showError.timer = setTimeout(() => { el.textContent = ''; }, 6000);
    }

    const call = (cmd, args = {}) => invoke(cmd, { id, ...args }).catch(showError);

    // Destructive buttons ask inline (native confirm() is cut off in this short page): the first
    // click arms the button, a second one within 3 s does it.
    function confirmButton(text, armedText, title, className, onConfirm) {
      const b = button(text, title, () => {
        if (b.classList.contains('armed')) return onConfirm();
        b.classList.add('armed');
        b.textContent = armedText;
        setTimeout(() => {
          b.classList.remove('armed');
          b.textContent = text;
        }, 3000);
      }, className);
      return b;
    }

    const slotName = (slot) => slot.name || `Slot ${slot.id}`;
    const frontPage = (panels) => panels?.pages?.find((p) => p.label === panels.front);
    const pageName = (page) => page.login || t('{platform} (not on a channel)', { platform: PLATFORMS[page.platform].name });

    // While the player types (renaming, adding a channel), state updates don't redraw the row.
    let editing = false;
    let latest = null;
    // The app's update status (see updater.rs), for the button shown while the top bar is hidden.
    let update = null;
    const redraw = () => { editing = false; if (latest) render(latest); };

    // Click = show the slot fullscreen (again = grid). Double-click = rename it in place
    // (Enter saves, Esc cancels, empty = default name).
    function nameButton(slot, focused) {
      const keys = Shortcuts.keys(`focus${slot.id}`);
      const b = button(slotName(slot), `${focused ? t('Back to the grid') : t('Show this slot fullscreen')}${keys ? ` (${keys})` : ''} · ${t('double-click to rename')}`, () => {
        clearTimeout(b.clickTimer);
        b.clickTimer = setTimeout(() => invoke('focus_slot', { id }).catch(showError), 220);
      }, 'name');
      b.addEventListener('dblclick', () => {
        clearTimeout(b.clickTimer);
        editing = true;
        const input = document.createElement('input');
        input.value = slot.name || '';
        input.placeholder = `Slot ${slot.id}`;
        input.maxLength = 40;
        input.style.width = '130px';
        let done = false;
        const finish = (saveIt) => {
          if (done) return;
          done = true;
          (saveIt ? call('rename_slot', { name: input.value }) : Promise.resolve()).finally(redraw);
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') finish(true);
          if (e.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        b.replaceWith(input);
        input.focus();
        input.select();
      });
      return b;
    }

    // Opens the platform's site in place of the game, in this slot's session (log in there).
    // Going back to the game leaves it running hidden and muted; ⏹ closes it for good.
    function platformButton(platform, panels) {
      const { svg, name } = PLATFORMS[platform];
      const shown = frontPage(panels)?.platform === platform;
      const count = panels?.pages?.filter((p) => p.platform === platform).length ?? 0;
      const title = shown
        ? t('Back to the game ({name} keeps running muted)', { name })
        : count
          ? t(count > 1 ? '{count} {name} streams running in the background — click to show one (the pills pick which)'
              : '1 {name} stream running in the background — click to show it', { count, name })
          : t('Open {name} in this slot (log in here)', { name });
      const b = button('', title, () => call('toggle_panel', { platform }), 'platform');
      b.innerHTML = svg;
      b.setAttribute('aria-label', title);
      if (shown) b.classList.add('panel-open');
      if (count && !shown) {
        b.classList.add('running');
        if (count > 1) b.dataset.count = count;
      }
      return b;
    }

    // "+": type a channel name (on the picked platform) or paste a Twitch/Kick link; Enter opens
    // it as a stream in this slot.
    let addPlatform = 'twitch';
    function addButton() {
      const b = button('+', t('Add a Twitch or Kick channel to this slot'), () => openAddBox(b), 'add');
      return b;
    }

    function openAddBox(addBtn) {
      editing = true;
      addBtn.classList.add('open');
      const box = document.createElement('span');
      box.className = 'addbox';
      const picks = ['twitch', 'kick'].map((platform) => {
        const p = button('', t('Channel on {name}', { name: PLATFORMS[platform].name }), () => {
          addPlatform = platform;
          picks.forEach((x) => x.classList.toggle('on', x.dataset.platform === platform));
          input.focus();
        }, 'pick');
        p.dataset.platform = platform;
        p.innerHTML = PLATFORMS[platform].svg;
        p.classList.toggle('on', platform === addPlatform);
        // Keep the focus in the box, so picking a platform doesn't close it.
        p.addEventListener('mousedown', (e) => e.preventDefault());
        return p;
      });
      const input = document.createElement('input');
      input.placeholder = t('channel name');
      input.maxLength = 200;
      let busy = false;
      const close = () => { box.remove(); redraw(); };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') close();
        if (e.key !== 'Enter' || busy || !input.value.trim()) return;
        busy = true;
        invoke('add_channel', { id, text: input.value, platform: addPlatform })
          .then(close)
          .catch((err) => { busy = false; showError(err); input.select(); });
      });
      input.addEventListener('blur', () => { if (!busy) close(); });
      box.append(...picks, input);
      addBtn.after(box);
      input.focus();
    }

    function stopButton(panels) {
      const page = frontPage(panels);
      if (!page) return [];
      return [button('⏹', t('Stop {name} ({platform})', { name: pageName(page), platform: PLATFORMS[page.platform].name }),
        () => call('stop_page', { label: page.label }))];
    }

    function pill(page, shown) {
      const { svg, name } = PLATFORMS[page.platform];
      const el = document.createElement('span');
      el.className = 'pill' + (shown ? ' shown' : '');
      el.dataset.label = page.label;
      // A problem the app couldn't fix by itself (stalled, logged out, offline).
      if (page.warning) el.classList.add('warn');
      const show = button('', shown
        ? t('Back to the game ({name} keeps running muted)', { name: pageName(page) })
        : t('Show {name} ({platform}) in this slot', { name: pageName(page), platform: name }),
        () => call('show_page', { label: page.label }), 'show');
      show.innerHTML = svg;
      const text = document.createElement('span');
      text.textContent = page.login || name;
      show.append(text);
      if (page.warning) {
        show.append(Object.assign(document.createElement('span'), { className: 'warn-icon', textContent: '⚠' }));
        show.title = `${I18N.text(page.warning)}\n\n${show.title}`;
      }
      // A tip, not a problem: this account doesn't follow the channel (the app never follows).
      if (page.not_following) {
        show.append(Object.assign(document.createElement('span'), { className: 'follow-tip', textContent: '♡' }));
        const tip = page.platform === 'twitch'
          ? t("Tip: this account doesn't follow {name} on Twitch. Following gives +300 channel points once — show the stream and follow it there.", { name: pageName(page) })
          : t("Tip: this account doesn't follow {name} on Kick. Show the stream and follow it there.", { name: pageName(page) });
        show.title = `${tip}\n\n${show.title}`;
      }
      el.append(show, button('×', t('Stop {name}', { name: pageName(page) }), () => call('stop_page', { label: page.label }), 'stop'));
      return el;
    }

    // --- Running PokeIdle bonuses (from the game's own state), e.g. "XP 6h12" -------------
    const bonusBox = Object.assign(document.createElement('span'), { className: 'bonuses' });
    const BONUSES = [['xp', 'XP', '+15% XP'], ['capture', 'CAP', '+15% Capture Boost'], ['lure', 'LURE', '+15% Secret Lure']];
    function left(ms) {
      if (ms < 60000) return '<1m';
      const m = Math.floor(ms / 60000);
      const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h${String(mm).padStart(2, '0')}`;
      return `${mm}m`;
    }
    function renderBonuses() {
      const running = latest?.bonuses?.[id] || {};
      const now = Date.now();
      // Each platform's bonuses run on their own clock: one group per platform (Twitch, then
      // Kick), each with its platform mark and a chip per running bonus.
      const groups = [];
      for (const platform of ['twitch', 'kick']) {
        const chips = [];
        for (const [key, short, long] of BONUSES) {
          const ms = (running[platform]?.[key] || 0) - now;
          if (ms <= 0) continue;
          const chip = Object.assign(document.createElement('span'), { className: `bonus ${key}`, textContent: `${short} ${left(ms)}` });
          chip.title = t('{bonus} from {platform}: {left} left', { bonus: long, platform: PLATFORMS[platform].name, left: left(ms) });
          chips.push(chip);
        }
        // A platform without bonuses stays visible, marked as such ("?" until the game says).
        if (!chips.length) {
          const known = !!running[platform];
          const none = Object.assign(document.createElement('span'), { className: 'bonus none', textContent: known ? t('no bonus') : '?' });
          none.title = known
            ? t('No PokeIdle bonus from {platform} running', { platform: PLATFORMS[platform].name })
            : t("The game hasn't reported this account's {platform} bonuses yet", { platform: PLATFORMS[platform].name });
          chips.push(none);
        }
        const group = document.createElement('span');
        group.className = 'bgroup';
        const mark = Object.assign(document.createElement('span'), { className: 'bmark' });
        mark.innerHTML = PLATFORMS[platform].svg;
        mark.title = t('Bonuses from {platform}', { platform: PLATFORMS[platform].name });
        group.append(mark, ...chips);
        groups.push(group);
      }
      bonusBox.replaceChildren(...groups);
      renderVote();
    }

    // --- IdleHub vote reminder (accounts ticked in ⚙) --------------------------------------
    const voteBox = Object.assign(document.createElement('span'), { className: 'votebox' });
    // The game's daily Prey is due: today's free roll, or the pick of one of the 9 Pokémon.
    // Click = show this account fullscreen (the Prey is in the game's bag).
    function preyChip(state, focused) {
      const what = state.prey_pending?.[id];
      if (!what) return [];
      const title = what === 'pick'
        ? t('Prey rolled, but no Pokémon picked: its bonus does nothing yet. In the game: Bag → Prey, pick one of the 9.')
        : t("Today's free Prey roll is ready (it renews at 18:00 Brasília). In the game: Bag → Prey → Roll.");
      const chip = button(`🎯 ${t(what === 'pick' ? 'Pick Prey' : 'Prey')}`, title, () => {
        if (!focused) call('focus_slot');
      }, 'prey');
      // Not wanted today (none of the 9 is worth it): hidden until the 18:00 turn.
      const dismiss = button('×', t("Not today: hide this account's Prey reminder until 18:00 (Brasília)"), () => call('dismiss_prey'), 'prey-x');
      const box = Object.assign(document.createElement('span'), { className: 'preybox' });
      box.append(chip, dismiss);
      return [box];
    }

    function renderVote() {
      const s = latest?.vote?.[id];
      if (!s || s.error) {
        voteBox.replaceChildren();
        voteBox.title = I18N.text(s?.error || '');
        return;
      }
      const ms = s.readyAt - Date.now();
      const ready = ms <= 0;
      const chip = button(ready ? t('Vote') : `${t('Vote')} ${left(ms)}`, '', () => invoke('open_vote', { id }).catch(showError), `vote${ready ? ' ready' : ''}`);
      const pair = s.perDiamond ? ` · ${t('{n}/{of} toward the next diamond', { n: s.inPair, of: s.perDiamond })}` : '';
      chip.title = (ready
        ? t("IdleHub vote for {nick} is ready: opens the vote page in a window with this slot's session (sign in and confirm there)", { nick: s.nick })
        : t('Next IdleHub vote for {nick} in {left} (click to open the vote page anyway)', { nick: s.nick, left: left(ms) }))
        + `\n${t(s.votes === 1 ? '{n} vote' : '{n} votes', { n: s.votes })}, ${t(s.diamonds === 1 ? '{n} diamond' : '{n} diamonds', { n: s.diamonds })}${pair}`;
      voteBox.replaceChildren(chip);
    }
    setInterval(renderBonuses, 30000);

    function render(state) {
      latest = state;
      if (editing) return;
      const slot = state.slots.find((s) => s.id === id);
      if (!slot) return; // being closed
      const panels = state.panels[id];
      const focused = state.focus === id;
      document.body.classList.toggle('focused', focused);

      const scroll = controls.scrollLeft;
      const error = document.createElement('span');
      error.className = 'error';
      error.id = 'error';
      const mute = button(slot.muted ? '🔇' : '🔊', slot.muted ? t('Unmute this game') : t('Mute this game'),
        () => call('toggle_mute'), slot.muted ? 'muted' : '');
      const sep = () => Object.assign(document.createElement('span'), { className: 'sep' });
      // While the top toolbar is hidden, the top-left slot's header has the button that brings
      // it back.
      const showBar = state.toolbar_hidden && state.corner === id
        ? [button('▾', t('Show the top bar (+ SLOT, GRID, settings…)'),
            () => invoke('set_toolbar_hidden', { hidden: false }).catch(showError), 'showbar')]
        : [];
      // A new version is out and the top bar (where its button lives) is hidden: the same
      // button here, so an update never goes unseen.
      if (state.toolbar_hidden && state.corner === id && update?.available) {
        const v = update.available;
        const title = update.can_install
          ? t('Version {v} is out: click to update (the app closes, installs it and opens again)', { v })
          : t('Version {v} is out: click to open its download page', { v });
        showBar.push(update.progress != null
          ? Object.assign(button(t('Downloading {pct}%', { pct: update.progress }), title, () => {}, 'update'), { disabled: true })
          : update.can_install
            ? confirmButton(`⬆ ${v}`, t('Update now?'), title, 'update', () => invoke('install_update').catch(showError))
            : button(`⬆ ${v}`, title, () => invoke('install_update').catch(showError), 'update'));
      }
      // The account's game dropped out (logged in elsewhere, disconnected, no session): a red
      // chip that reloads the game.
      const issue = state.game_issues?.[id];
      const issueChip = issue
        ? [button(`⚠ ${t('Game')}`, `${I18N.text(issue)}\n\n${t('Click to reload the game')}`, () => call('reload_slot'), 'game-issue')]
        : [];
      controls.replaceChildren(
        ...showBar,
        nameButton(slot, focused),
        ...issueChip,
        mute,
        sep(),
        platformButton('twitch', panels),
        platformButton('kick', panels),
        ...stopButton(panels),
        bonusBox,
        voteBox,
        ...preyChip(state, focused),
        error,
        Object.assign(document.createElement('span'), { className: 'spacer' }),
        // Fullscreen: shows or hides the stats panel on the right.
        ...(focused
          ? [button('▤', state.focus_panel ? t('Hide the stats panel') : t('Show the stats panel'),
              () => invoke('set_focus_panel', { on: !state.focus_panel }).catch(showError),
              state.focus_panel ? 'panel-on' : '')]
          : []),
        button('⟳', t('Reload the game'), () => call('reload_slot')),
        confirmButton('×', t('Close?'), t('Close slot (keeps its login)'), '', () => call('close_slot')),
      );
      controls.scrollLeft = scroll;
      renderBonuses();

      // Right part: "+", then the pills (they scroll).
      const pillScroll = pills.scrollLeft;
      const pages = panels?.pages ?? [];
      // Grouped by platform, Twitch then Kick, each group keeping its own order.
      const logins = latest?.logins?.[id] || {};
      const groups = ['twitch', 'kick']
        .map((platform) => {
          const own = pages.filter((p) => p.platform === platform);
          // Not logged in there: its lives aren't opened, so a chip to log in takes their place.
          if (logins[platform] === false && !own.some((p) => p.login)) {
            const chip = document.createElement('button');
            chip.className = 'login-chip';
            chip.innerHTML = PLATFORMS[platform].svg;
            chip.append(t('Log in'), Object.assign(document.createElement('span'), { className: 'arrow', textContent: '→' }));
            chip.title = t('This account isn\'t logged in on {platform}: its streams earn nothing, so they aren\'t opened. Click to log in here; the streams start as soon as you do.', { platform: PLATFORMS[platform].name });
            chip.addEventListener('click', () => call('open_login', { platform }));
            const group = document.createElement('span');
            group.className = 'group';
            group.append(chip);
            return group;
          }
          if (!own.length) return null;
          const group = document.createElement('span');
          group.className = 'group';
          group.dataset.platform = platform;
          group.title = t('{platform} streams', { platform: PLATFORMS[platform].name });
          group.append(...own.map((p) => pill(p, p.label === panels.front)));
          return group;
        })
        .filter(Boolean);
      const parts = [];
      groups.forEach((g, i) => {
        if (i) parts.push(Object.assign(document.createElement('span'), { className: 'gsep' }));
        parts.push(g);
      });
      pills.replaceChildren(...(parts.length
        ? parts
        : [Object.assign(document.createElement('span'), {
            className: 'empty', textContent: t('No streams · + adds a channel') })]));
      streams.replaceChildren(addButton(), pillbox);
      pills.scrollLeft = pillScroll;
      updateScrollHints();
    }

    // Shows which sides of the pill row have more pills hidden (fade + arrow).
    function updateScrollHints() {
      const max = pills.scrollWidth - pills.clientWidth;
      pillbox.classList.toggle('more-left', pills.scrollLeft > 1);
      pillbox.classList.toggle('more-right', pills.scrollLeft < max - 1);
    }
    pills.addEventListener('scroll', updateScrollHints);
    new ResizeObserver(updateScrollHints).observe(pills);
    for (const [btnId, dir] of [['scroll-left', -1], ['scroll-right', 1]]) {
      document.getElementById(btnId).addEventListener('click', () => {
        pills.scrollBy({ left: dir * Math.max(120, pills.clientWidth * 0.6), behavior: 'smooth' });
      });
    }

    // Hold a pill and drag it sideways to reorder; the new order is saved. A short press
    // without moving is still a normal click.
    let drag = null;
    let swallowClick = false;
    pills.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.pill');
      if (!el || e.button !== 0) return;
      drag = { el, startX: e.clientX, pointerId: e.pointerId, moved: false };
    });
    pills.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (!drag.moved) {
        if (Math.abs(e.clientX - drag.startX) < 6) return;
        drag.moved = true;
        editing = true;
        drag.el.classList.add('dragging');
        pills.setPointerCapture(drag.pointerId);
      }
      // Near an edge, the row scrolls so the pill can reach hidden places.
      const box = pills.getBoundingClientRect();
      if (e.clientX < box.left + 24) pills.scrollLeft -= 10;
      else if (e.clientX > box.right - 24) pills.scrollLeft += 10;
      // A pill moves within its own platform's group.
      const group = drag.el.parentElement;
      const before = [...group.querySelectorAll('.pill')]
        .filter((p) => p !== drag.el)
        .find((p) => {
          const r = p.getBoundingClientRect();
          return e.clientX < r.left + r.width / 2;
        });
      if (before) {
        if (drag.el.nextElementSibling !== before) group.insertBefore(drag.el, before);
      } else if (group.lastElementChild !== drag.el) {
        group.appendChild(drag.el);
      }
    });
    const endDrag = () => {
      const d = drag;
      drag = null;
      if (!d?.moved) return;
      d.el.classList.remove('dragging');
      swallowClick = true;
      setTimeout(() => { swallowClick = false; }, 0);
      const labels = [...pills.querySelectorAll('.pill')].map((p) => p.dataset.label);
      invoke('reorder_pages', { id, labels }).catch(showError).finally(redraw);
    };
    pills.addEventListener('pointerup', endDrag);
    pills.addEventListener('pointercancel', endDrag);
    // The click that ends a drag must not show or stop the pill.
    pills.addEventListener('click', (e) => {
      if (swallowClick) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    // Mouse wheel scrolls a row sideways.
    for (const row of [controls, pills]) {
      row.addEventListener('wheel', (e) => {
        if (e.deltaY) {
          row.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    }
    Shortcuts.onChange(() => { if (latest && !editing) render(latest); });

    listen('state', (e) => render(e.payload));
    const updateChanged = (u) => { update = u; if (latest && !editing) render(latest); };
    listen('update', (e) => updateChanged(e.payload));
    invoke('get_update').then(updateChanged).catch(() => {});
    listen('error', (e) => showError(e.payload));
    I18N.onChange(() => { if (latest && !editing) render(latest); });
    invoke('get_state').then(render);
  </script>
</body>
</html>
