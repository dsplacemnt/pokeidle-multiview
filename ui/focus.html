<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stats panel</title>
  <style>
    :root {
      --bg: #16181d;
      --card: #1d2027;
      --chip: #23262e;
      --chip-active: #3a4150;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #f2c14e;
      --ok: #3ddc84;
      --bad: #ff8a80;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.35 "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--chip-active) transparent;
      border-left: 2px solid var(--accent); }
    .top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px;
      padding: 10px 10px 8px 12px; background: var(--bg); }
    .top h1 { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 15px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top .sub { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
    button { background: var(--chip); color: var(--text); border: 0; border-radius: 5px; height: 24px;
      padding: 0 8px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
    button:hover { background: var(--chip-active); }
    .cards { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 14px 14px; }
    .card { background: var(--card); border-radius: 10px; padding: 12px 12px 12px; }
    .card h2 { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .card h2 .extra { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .empty { color: var(--muted); font-size: 12px; }
    .mark { display: inline-flex; width: 16px; height: 16px; flex: none; }
    .mark svg { width: 16px; height: 16px; display: block; }
    /* Bonuses: one block per platform, a bar per bonus filling toward 24 h. */
    .plat { display: flex; flex-direction: column; gap: 5px; }
    .plat + .plat { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--chip); }
    .plat-head { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .plat-head .state { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    .plat-head .state.bad { color: var(--bad); }
    .brow { display: grid; grid-template-columns: 56px 1fr 62px; align-items: center; gap: 8px; font-size: 12px; }
    .brow .label { font-weight: 600; }
    .brow .time { text-align: right; font-variant-numeric: tabular-nums; }
    .brow.off .label, .brow.off .time { color: var(--muted); font-weight: 500; }
    .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 3px; }
    /* Goals mode: the goal as a mark on the bar; met = green time, being bought = outlined. */
    .bar { position: relative; overflow: visible; }
    .bar i { overflow: hidden; }
    .bar b.goal { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px;
      background: var(--text); opacity: .55; }
    .brow.met .time { color: var(--ok); }
    .brow.buying .time { color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); border-radius: 8px; padding: 0 4px; }
    .xp .label { color: #ffd76b; } .xp .bar i { background: #f2c14e; }
    .capture .label { color: #8fd3ff; } .capture .bar i { background: #5aaaff; }
    .lure .label { color: #d8a8ff; } .lure .bar i { background: #b478ff; }
    .target { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
    .target b { color: var(--text); font-weight: 600; }
    /* Lists (streams, points, log). */
    .list { display: flex; flex-direction: column; gap: 4px; }
    .item { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; }
    .item .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .right { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .item.shown .name { color: var(--accent); font-weight: 600; }
    .item.warn .name { color: var(--bad); }
    .item .follow-tip { flex: none; color: var(--muted); font-size: 12px; cursor: help; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
    .item.warn .dot { background: var(--bad); }
    .why { font-size: 11.5px; color: var(--bad); margin: -2px 0 2px 23px; }
    /* Chores: a row per daily task with its state on the right. */
    .chore { display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-height: 26px; }
    .chore + .chore { border-top: 1px solid var(--chip); }
    .chore .name { flex: 1 1 auto; }
    .chore .name small { display: block; color: var(--muted); font-size: 11.5px; }
    .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--chip);
      color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tag.ok { color: var(--ok); background: rgba(61, 220, 132, .12); }
    button.tag.ready { color: #1a1408; background: var(--accent); height: auto; }
    button.tag.ready:hover { background: #ffd76b; }
    /* Hunt analysis: supplies table, pace tiles, next levels. */
    .hunt-sec { display: grid; gap: 5px; }
    .hunt-sec + .grid, .grid + .hunt-sec { margin-top: 12px; }
    .sub { font-size: 11px; font-weight: 600; color: var(--muted); }
    .supply { display: grid; grid-template-columns: minmax(0, 1fr) 58px 64px 54px; gap: 8px; align-items: center;
      font-size: 12.5px; font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 6px; background: var(--chip); }
    .supply.shead { background: transparent; padding-top: 0; padding-bottom: 0; font-size: 10.5px; color: var(--muted); }
    .supply .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .supply .sleft, .supply .srate, .supply .seta { text-align: right; white-space: nowrap; }
    .supply .srate { color: var(--muted); }
    .supply .seta { font-weight: 700; }
    .supply.warn .seta { color: #ffb74d; }
    .supply.low { box-shadow: inset 0 0 0 1px rgba(255, 138, 128, .55); }
    .supply.low .seta { color: var(--bad); }
    .lvrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px; gap: 8px; font-size: 12.5px;
      font-variant-numeric: tabular-nums; }
    .lvrow .lvname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .lvrow .lvfrom { color: var(--muted); }
    .lvrow .lvin { text-align: right; font-weight: 700; }
    .hunt-foot { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat { background: var(--chip); border-radius: 6px; padding: 7px 9px; min-width: 0; }
    .stat.pos .v { color: var(--ok); }
    .stat.neg .v { color: var(--bad); }
    .stat .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat .k { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log .item { align-items: baseline; font-size: 12px; }
    .log .when { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; width: 38px; }
    .log .name { white-space: normal; overflow: visible; }
  </style>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="top">
    <h1 id="title">Stats</h1>
    <button id="grid" data-i18n-title title="Back to the grid">GRID</button>
    <button id="hide" data-i18n-title title="Hide this panel (▤ in the slot header brings it back)">✕</button>
  </div>
  <div class="cards" id="cards"></div>
  <script>
    // The single-focus stats panel: shown on the right while a slot is fullscreen, with that
    // account's bonuses, streams, daily chores, game numbers and what the app did for it.
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { t } = I18N;
    const cards = document.getElementById('cards');
    let view = null;

    const PLATFORMS = {
      twitch: { name: 'Twitch', svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9146FF" d="M4.3 2 2.5 6.5V20h5v2.5h2.8l2.5-2.5h4l4.7-4.7V2H4.3Z"/><path fill="#fff" d="M19.5 14.2 16.7 17h-4.5l-2.5 2.5V17H5.5V4h14v10.2Z"/><path fill="#9146FF" d="M15.2 7.2h2v5.6h-2zM10.6 7.2h2v5.6h-2z"/></svg>` },
      kick: { name: 'Kick', svg: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#53FC18"/><path fill="#0B0E0F" d="M5.5 4.5h5v4h1.7V6.6h1.9V4.5h4.4v5.3h-2.1v1.9h-1.9v.6h1.9v1.9h2.1v5.3h-4.4v-2.1h-1.9v-1.9h-1.7v4h-5z"/></svg>` },
    };
    const BONUSES = [['xp', 'XP', '+15% XP'], ['capture', 'Capture', '+15% Capture Boost'], ['lure', 'Lure', '+15% Secret Lure']];
    const DAY = 24 * 3600 * 1000;

    const el = (tag, className, text) => {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const mark = (platform) => {
      const m = el('span', 'mark');
      m.innerHTML = PLATFORMS[platform].svg;
      return m;
    };
    function card(title, extra) {
      const c = el('section', 'card');
      const h = el('h2', '', title);
      if (extra) h.append(el('span', 'extra', extra));
      c.append(h);
      return c;
    }
    function left(ms) {
      if (ms < 60000) return '<1m';
      const m = Math.floor(ms / 60000);
      const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h${String(mm).padStart(2, '0')}`;
      return `${mm}m`;
    }
    const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const num = (n) => Number(n).toLocaleString();

    function bonusesCard(v) {
      const c = card(t('Bonuses'));
      const now = Date.now();
      for (const platform of ['twitch', 'kick']) {
        const block = el('div', 'plat');
        const head = el('div', 'plat-head');
        const linked = v[`${platform}_linked`];
        const state = el('span', 'state' + (linked === false ? ' bad' : ''),
          t(linked === true ? 'linked in game' : linked === false ? 'not linked in game' : 'waiting for the game'));
        head.append(mark(platform), el('span', '', PLATFORMS[platform].name), state);
        block.append(head);
        const ends = v.running?.[platform];
        for (const [key, short, long] of BONUSES) {
          const ms = (ends?.[key] || 0) - now;
          // Goals mode: this bonus's goal (the first one for it), drawn as a mark on the bar.
          const goal = v.goals?.list.find((g) => g.bonus === key);
          const met = goal && ms / 3600000 >= goal.hours;
          const buying = goal && v.next?.[platform] === key;
          const row = el('div', `brow ${key}` + (ms > 0 ? '' : ' off') + (met ? ' met' : '') + (buying ? ' buying' : ''));
          const bar = el('div', 'bar');
          const fill = el('i');
          fill.style.width = `${Math.max(0, Math.min(1, ms / DAY)) * 100}%`;
          bar.append(fill);
          if (goal) {
            const mark_ = el('b', 'goal');
            mark_.style.left = `${Math.min(1, goal.hours / 24) * 100}%`;
            bar.append(mark_);
          }
          row.append(el('span', 'label', short), bar, el('span', 'time', ms > 0 ? left(ms) : ends ? '—' : '?'));
          row.title = (ms > 0
            ? t('{bonus} from {platform}: ends at {time}', { bonus: long, platform: PLATFORMS[platform].name, time: clock(now + ms) })
            : t('{bonus}: not running', { bonus: long }))
            + (goal ? `\n${t('Goal: {hours}h', { hours: goal.hours })}` : '');
          block.append(row);
        }
        c.append(block);
      }
      // What the points buy now: the fixed bonus, or per platform what the goals ask for.
      const names = { xp: 'XP', capture: 'Capture Boost', lure: 'Secret Lure' };
      const target = el('div', 'target');
      if (v.goals) {
        const parts = ['twitch', 'kick'].map((p) => `${PLATFORMS[p].name} ${v.next?.[p] ? `→ ${names[v.next[p]]}` : '✓'}`);
        target.append(t('Goals:') + ' ', el('b', '', parts.join(' · ')));
        target.title = t('→ = buying now · ✓ = goals met (or waiting for the game)');
      } else {
        target.append(t('Redeeming:') + ' ', el('b', '', v.bonus ? names[v.bonus] : t('none (⚙ to pick)')));
      }
      c.append(target);
      return c;
    }

    // A tip, not a problem: this account doesn't follow the channel (the app never follows).
    function followTip(s) {
      const tip = el('span', 'follow-tip', '♡');
      tip.title = s.platform === 'twitch'
        ? t("Tip: this account doesn't follow {name} on Twitch. Following gives +300 channel points once — show the stream and follow it there.", { name: s.login })
        : t("Tip: this account doesn't follow {name} on Kick. Show the stream and follow it there.", { name: s.login });
      return tip;
    }

    function streamsCard(v) {
      const c = card(t('Streams'), v.streams.length ? t('{n} open', { n: v.streams.length }) : '');
      const list = el('div', 'list');
      if (!v.streams.length) list.append(el('span', 'empty', t('No streams open in this slot')));
      for (const platform of ['twitch', 'kick']) {
        for (const s of v.streams.filter((x) => x.platform === platform)) {
          const item = el('div', 'item' + (s.shown ? ' shown' : '') + (s.warning ? ' warn' : ''));
          item.append(mark(platform), el('span', 'name', s.login || t('{platform} (no channel)', { platform: PLATFORMS[platform].name })),
            ...(s.not_following ? [followTip(s)] : []),
            s.shown ? el('span', 'right', t('on screen')) : el('span', 'dot'));
          list.append(item);
          if (s.warning) list.append(el('div', 'why', I18N.text(s.warning)));
        }
      }
      c.append(list);
      return c;
    }

    function pointsCard(v) {
      const c = card(t('Channel points'));
      const list = el('div', 'list');
      if (!v.points.length) list.append(el('span', 'empty', t('None seen yet (they show once a stream reports them)')));
      for (const [platform, channel, points] of v.points.slice(0, 8)) {
        const item = el('div', 'item');
        item.append(mark(platform), el('span', 'name', channel), el('span', 'right', num(points)));
        list.append(item);
      }
      c.append(list);
      return c;
    }

    function choresCard(v) {
      const c = card(t('Daily chores'));
      // IdleHub vote.
      const vote = el('div', 'chore');
      const vName = el('span', 'name', t('IdleHub vote'));
      let vTag;
      const s = v.vote;
      if (!v.vote_reminded) {
        vName.append(el('small', '', t('Reminder off for this account (⚙)')));
        vTag = el('span', 'tag', t('off'));
      } else if (!s || s.error) {
        vName.append(el('small', '', s?.error ? I18N.text(s.error) : t('Checking…')));
        vTag = el('span', 'tag', '?');
      } else {
        const ms = s.readyAt - Date.now();
        const pair = s.perDiamond ? ` (${t('{n}/{of} to next', { n: s.inPair, of: s.perDiamond })})` : '';
        vName.append(el('small', '', `${s.nick} · ${t(s.votes === 1 ? '{n} vote' : '{n} votes', { n: s.votes })} · ${s.diamonds} 💎${pair}`));
        vTag = el('button', 'tag' + (ms <= 0 ? ' ready' : ''), ms <= 0 ? t('Vote now') : t('in {left}', { left: left(ms) }));
        vTag.title = t("Opens the vote page in a window with this slot's session");
        vTag.addEventListener('click', () => invoke('open_vote', { id: v.slot }).catch(() => {}));
      }
      vote.append(vName, vTag);
      // Kick Daily Reward.
      const daily = el('div', 'chore');
      const dName = el('span', 'name', t('Kick Daily Reward'));
      let dTag;
      if (!v.daily_enabled) {
        dName.append(el('small', '', t('Auto-claim off (⚙)')));
        dTag = el('span', 'tag', t('off'));
      } else if (v.daily_done_today) {
        dName.append(el('small', '', t('Claimed today (UTC)')));
        dTag = el('span', 'tag ok', t('done'));
      } else {
        dName.append(el('small', '', t('Claimed on the next manager pass')));
        dTag = el('span', 'tag', t('pending'));
      }
      daily.append(dName, dTag);
      c.append(vote, daily);
      return c;
    }

    // The game's own numbers for this session (whatever game-watch.js picked from its state).
    // Hunt analysis (from game-watch.js): supplies with how long they last, the pace, the next
    // levels and the catches, since the game loaded or the hunt changed.
    const compact = (n) => (n === null || n === undefined ? '—'
      : Math.abs(n) >= 1e4 ? new Intl.NumberFormat(document.documentElement.lang, { notation: 'compact', maximumFractionDigits: 1 }).format(n)
      : Math.round(n).toLocaleString(document.documentElement.lang));
    const hoursText = (h) => {
      if (h === null || h === undefined) return '—';
      const m = Math.round(h * 60);
      const d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
      return d ? `${d}d ${hh}h` : hh ? `${hh}h${String(mm).padStart(2, '0')}` : `${mm}m`;
    };
    const huntName = (slug) => (slug || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    const KINDS = { ball: 'Balls', potion: 'Potions', revive: 'Revives' };

    function huntCard(v) {
      const h = v.game;
      if (!h || h.v !== 2) return null;
      const c = card(t('Hunt analysis'), [huntName(h.hunt), hoursText(h.minutes / 60)].filter(Boolean).join(' · '));

      // Supplies: what's left, used per hour, and how long it lasts at this pace.
      const sup = el('div', 'hunt-sec');
      sup.append(el('div', 'sub', t('Supplies')));
      const rows = (h.supplies || []).filter((s) => s.perHour > 0 || s.left > 0 || s.used > 0)
        .sort((a, b) => (a.hoursLeft ?? Infinity) - (b.hoursLeft ?? Infinity));
      if (!rows.length) sup.append(el('span', 'empty', t('Waiting for the game to show the bag (a few minutes)')));
      for (const s of rows) {
        const r = el('div', 'supply' + (s.hoursLeft !== null && s.hoursLeft < 2 ? ' low' : s.hoursLeft !== null && s.hoursLeft < 6 ? ' warn' : ''));
        const name = el('span', 'sname', s.name);
        name.title = t(KINDS[s.kind]);
        r.append(
          name,
          el('span', 'sleft', compact(s.left)),
          el('span', 'srate', s.perHour !== null && s.perHour !== undefined ? (s.perHour ? t('{n}/h', { n: compact(s.perHour) }) : t('unused')) : s.used ? t('{n} used', { n: compact(s.used) }) : t('unused')),
          el('span', 'seta', s.hoursLeft !== null ? hoursText(s.hoursLeft) : '—'),
        );
        r.title = s.hoursLeft !== null
          ? t('{name}: {left} left, {rate} per hour — lasts about {time}', { name: s.name, left: compact(s.left), rate: compact(s.perHour), time: hoursText(s.hoursLeft) })
          : t('{name}: {left} left, not used in this hunt yet', { name: s.name, left: compact(s.left) });
        sup.append(r);
      }
      const head = el('div', 'supply shead');
      head.append(el('span', 'sname', ''), el('span', 'sleft', t('left')), el('span', 'srate', t('per hour')), el('span', 'seta', t('lasts')));
      if (rows.length) sup.children[0].after(head);

      // Pace: tiles.
      const grid = el('div', 'grid');
      const tile = (value, label, cls) => {
        const s = el('div', 'stat' + (cls ? ` ${cls}` : ''));
        s.append(el('div', 'v', value), el('div', 'k', label));
        grid.append(s);
      };
      tile(compact(h.killsPerHour), t('Kills per hour'));
      tile(compact(h.xpPerHour), t('XP per hour'));
      tile(compact(h.goldPerHour), t('Gold per hour'));
      tile(h.costPerHour === null ? '—' : `−${compact(h.costPerHour)}`, t('Supplies per hour'));
      tile(h.netPerHour === null ? '—' : `${h.netPerHour >= 0 ? '+' : ''}${compact(h.netPerHour)}`, t('Net gold per hour'), h.netPerHour !== null && h.netPerHour < 0 ? 'neg' : 'pos');
      const rate = h.throws ? Math.round((h.catches / h.throws) * 1000) / 10 : null;
      tile(h.throws ? `${h.catches}/${h.throws}` : '—', rate !== null ? t('Catches ({rate}%)', { rate }) : t('Catches'));

      // Next levels.
      const lv = el('div', 'hunt-sec');
      lv.append(el('div', 'sub', t('Next level')));
      const level = (who, from, hoursLeft) => {
        const r = el('div', 'lvrow');
        r.append(el('span', 'lvname', who), el('span', 'lvfrom', `Lv ${from} → ${from + 1}`), el('span', 'lvin', hoursLeft !== null ? t('in {time}', { time: hoursText(hoursLeft) }) : '—'));
        lv.append(r);
      };
      if (h.trainer) level(t('Trainer'), h.trainer.level, h.trainer.hoursLeft);
      if (h.pokemon) level(h.pokemon.name, h.pokemon.level, h.pokemon.hoursLeft);

      const foot = [];
      if (h.killsPerHour === null) foot.push(t('Rates show after 5 minutes of hunting.'));
      if (h.shinies) foot.push(t('{n} shiny seen', { n: h.shinies }));
      if (h.wild) foot.push(t('Fighting {wild}', { wild: h.wild }));
      c.append(sup, grid);
      if (h.trainer || h.pokemon) c.append(lv);
      if (foot.length) c.append(el('div', 'hunt-foot', foot.join(' · ')));
      return c;
    }

    function logCard(v) {
      const c = card(t('Activity'), v.log.length ? t('last {n}', { n: v.log.length }) : '');
      const list = el('div', 'list log');
      if (!v.log.length) list.append(el('span', 'empty', t('Nothing yet — the app logs swaps, redeems, reloads and claims here')));
      for (const [at, text] of v.log) {
        const item = el('div', 'item');
        item.append(el('span', 'when', clock(at)), el('span', 'name', I18N.text(text)));
        list.append(item);
      }
      c.append(list);
      return c;
    }

    function render(v) {
      view = v;
      if (!v) { cards.replaceChildren(); return; }
      const title = document.getElementById('title');
      title.textContent = v.name;
      title.append(el('span', 'sub', `#${v.slot}`));
      const scroll = document.scrollingElement.scrollTop;
      cards.replaceChildren(...[huntCard(v), bonusesCard(v), choresCard(v), streamsCard(v), pointsCard(v), logCard(v)].filter(Boolean));
      document.scrollingElement.scrollTop = scroll;
    }

    document.getElementById('grid').addEventListener('click', () => view && invoke('focus_slot', { id: view.slot }).catch(() => {}));
    document.getElementById('hide').addEventListener('click', () => invoke('set_focus_panel', { on: false }).catch(() => {}));
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key >= '1' && e.key <= '4') invoke('focus_slot', { id: Number(e.key) }).catch(() => {});
    });
    listen('focus', (e) => render(e.payload));
    I18N.onChange(() => render(view));
    const refresh = () => invoke('get_focus').then(render).catch(() => {});
    // Countdowns tick, and log lines that came without a state change show up.
    setInterval(refresh, 15000);
    refresh();
  </script>
</body>
</html>
